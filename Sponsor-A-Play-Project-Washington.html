<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Playhouse Map — Washington</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=source-sans-3:400,600,700,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#004270;--blue:#0378ad;--white:#fff;--bg:#f0f9fd;
  --ff:'Source Sans 3','Arial Narrow',Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom, 0px);
}
html,body{width:100%;height:100%;margin:0;padding:0;background:var(--bg);overflow:hidden;font-family:var(--ff)}
body{display:flex;flex-direction:column;justify-content:center;}

#map-wrap{
  position:relative;width:100%;height:100%;
  margin:0 auto;
  user-select:none;-webkit-user-select:none;
  opacity:0;transition:opacity 1.2s ease;
}
#map-wrap.visible{opacity:1}

#map-area{
  position:absolute;inset:0;width:100%;height:100%;
}

#control-strip{
  position:absolute;left:0;right:0;bottom:0;
  height:auto;pointer-events:none;z-index:30;
}
#control-strip > *{pointer-events:auto;}

svg#us-map{
  position:absolute;top:0;left:0;z-index:1;
  width:100%;height:100%;display:block;cursor:grab;touch-action:none;
}
svg#us-map:active{cursor:grabbing}
/* While intro is running, block all map interaction */
svg#us-map.locked{cursor:default;pointer-events:none;}
.state{stroke:#002d50;stroke-width:0.5;stroke-linejoin:round}

/* ── HOVER / TAP TOOLTIP ── */
#pin-tip{
  position:absolute;z-index:50;left:0;top:0;
  transform:translate(-50%,-100%);
  background:var(--navy);color:#fff;
  padding:9px 13px 10px;border-radius:11px;
  font-family:var(--ff);text-align:center;white-space:nowrap;
  pointer-events:none;opacity:0;
  box-shadow:0 6px 26px rgba(0,42,70,.30),0 2px 6px rgba(0,42,70,.16);
  transition:opacity .18s ease, transform .22s cubic-bezier(0.34,1.45,0.64,1);
  will-change:transform,opacity;
}
#pin-tip.active{opacity:1;}
#pin-tip-name{font-size:15px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;}
#pin-tip-meta{font-size:11px;font-weight:600;color:rgba(255,255,255,0.62);margin-top:3px;letter-spacing:.02em;}
#pin-tip-meta .priority{color:#7dd4f8;}
#pin-tip::after{
  content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:6px solid var(--navy);
}
@media(max-width:767px){
  #pin-tip-name{font-size:14px;}
  #pin-tip-meta{font-size:10px;}
}

/* Zoom controls — hidden until intro complete */
#zoom-controls{
  position:absolute;right:16px;bottom:16px;display:flex;flex-direction:row;gap:6px;z-index:30;
  opacity:0;pointer-events:none;transition:opacity .4s ease;
}
#zoom-controls.ready{opacity:1;pointer-events:auto;}
.zoom-btn{width:32px;height:32px;background:#fff;border:1.5px solid #cde4f0;border-radius:8px;font-size:18px;font-weight:700;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,42,70,.12);transition:background .12s,transform .1s;-webkit-tap-highlight-color:transparent;font-family:var(--ff)}
.zoom-btn:hover{background:#f0f7fc}
.zoom-btn:active{transform:scale(.93)}

/* Legend — hidden until intro complete */
#map-legend{
  position:absolute;left:16px;bottom:16px;z-index:30;
  background:var(--navy);border:none;border-radius:10px;
  padding:9px 14px;
  display:flex;align-items:center;gap:9px;
  box-shadow:0 2px 12px rgba(0,42,70,.28);
  font-family:var(--ff);
  opacity:0;pointer-events:none;transition:opacity 0.6s ease;
}
#map-legend.visible{opacity:1;pointer-events:auto;}
#legend-text{display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
.legend-item{display:flex;align-items:center;gap:7px;}
#legend-main{font-size:12px;font-weight:700;color:#fff;line-height:1.2;letter-spacing:.01em;white-space:nowrap;}
#legend-priority{font-size:12px;font-weight:700;color:#7dd4f8;line-height:1.2;letter-spacing:.01em;white-space:nowrap;}
@media(max-width:767px){
  #map-legend{padding:7px 11px;gap:6px;border-radius:8px;left:10px;}
  #zoom-controls{right:10px;gap:5px;}
  .zoom-btn{width:30px;height:30px;}
  #legend-main,#legend-priority{font-size:10px;}
}

/* ── SPLASH ── */
#splash{
  position:fixed;inset:0;z-index:100;overflow:hidden;
  background:var(--bg);pointer-events:all;
  transition:opacity 0.6s ease;
}
#splash.fade-out{opacity:0;}

/* ── PHOTO GRID ── */
#grid-layer{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:1;
  transition:opacity 0.3s ease;
}
#photo-grid{
  display:grid;
  gap:5px;
}
.grid-cell{
  border-radius:7px;
  overflow:hidden;
  background:#c5dff0;
  opacity:0;
  transform:scale(0.55);
  transition:opacity 0.28s ease, transform 0.28s cubic-bezier(0.34,1.35,0.64,1);
  display:flex;align-items:center;justify-content:center;
}
.grid-cell.visible{opacity:1;transform:scale(1);}
.grid-cell.exit{
  opacity:0;
  transform:scale(0.65);
  transition:opacity 0.22s ease, transform 0.22s ease;
}
.grid-cell img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;}

/* ── LOGO + COUNTER PHASE ── */
#splash-ui{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.7s ease;
}
#splash-ui.show{opacity:1;}
#logo-svg-wrap{margin-bottom:20px;}
#num-clip{overflow:visible;line-height:1;width:100%;text-align:center;padding:0 20px;}
#counter-num{
  display:block;font-size:clamp(72px,16vw,180px);font-weight:900;
  letter-spacing:-0.04em;color:var(--navy);font-variant-numeric:tabular-nums;
  line-height:1;text-align:center;white-space:nowrap;
}
#label-clip{overflow:hidden;line-height:1;margin-top:.1em;width:100%;text-align:center;padding:0 20px;}
#counter-label{
  display:block;font-size:clamp(13px,2.4vw,32px);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--navy);
  line-height:1;text-align:center;white-space:nowrap;
}
</style>

// ── SEEDED RANDOM ─────────────────────────────────────────────
function mulberry32(s){
  return function(){
    s|=0;s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
const rng=mulberry32(Math.floor(Math.random()*2147483647));
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

let _logoFillRect=null;
function easeOut4(t){return 1-Math.pow(1-t,4);}

function drawLogo(){
  return new Promise(resolve=>{
    const ns='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','-40 -40 2080 2128');
    svg.setAttribute('width',isMobile?'70':'90');
    svg.setAttribute('height',isMobile?'70':'90');
    svg.style.cssText='display:block;overflow:visible;';
    const defs=document.createElementNS(ns,'defs');
    const clip=document.createElementNS(ns,'clipPath');
    clip.setAttribute('id','lfc');
    const rect=document.createElementNS(ns,'rect');
    rect.setAttribute('x','-40');rect.setAttribute('y','2088');
    rect.setAttribute('width','2080');rect.setAttribute('height','2128');
    _logoFillRect=rect;
    clip.appendChild(rect);defs.appendChild(clip);svg.appendChild(defs);
    const strokeEls=LOGO_PATHS.map(d=>{
      const p=document.createElementNS(ns,'path');
      p.setAttribute('d',d);
      p.style.cssText='fill:none;stroke:#004270;stroke-width:28;stroke-linecap:round;stroke-linejoin:round;';
      svg.appendChild(p);return p;
    });
    const fillG=document.createElementNS(ns,'g');
    fillG.setAttribute('clip-path','url(#lfc)');
    LOGO_PATHS.forEach(d=>{
      const p=document.createElementNS(ns,'path');
      p.setAttribute('d',d);p.style.cssText='fill:#004270;stroke:none;';
      fillG.appendChild(p);
    });
    svg.appendChild(fillG);
    document.getElementById('logo-svg-wrap').appendChild(svg);
    const lens=strokeEls.map(el=>el.getTotalLength());
    strokeEls.forEach((el,i)=>{el.style.strokeDasharray=lens[i];el.style.strokeDashoffset=lens[i];});
    const DRAW_MS=1400,STAGGER=180;
    strokeEls.forEach((el,i)=>{
      setTimeout(()=>{
        el.style.transition=`stroke-dashoffset ${DRAW_MS}ms cubic-bezier(0.4,0,0.2,1)`;
        el.style.strokeDashoffset='0';
      },i*STAGGER+60);
    });
    setTimeout(resolve,STAGGER*LOGO_PATHS.length+DRAW_MS+60);
  });
}

function rippleOrder(cols,rows){
  const cx=(cols-1)/2,cy=(rows-1)/2;
  const items=[];
  for(let r=0;r<rows;r++)
    for(let c=0;c<cols;c++)
      items.push({idx:r*cols+c,dist:Math.sqrt((c-cx)**2+(r-cy)**2)});
  items.sort((a,b)=>a.dist-b.dist);
  return items.map(x=>x.idx);
}

async function buildGridCells(){
  let filenames=[];
  try{
    const res=await fetch(GITHUB_API);
    if(res.ok){
      const items=await res.json();
      filenames=items
        .filter(f=>f.type==='file'&&/\.(jpe?g|png|gif|webp)$/i.test(f.name))
        .map(f=>f.name);
    }
  }catch(e){}

  const picked=shuffle(filenames).slice(0,GRID_TOTAL);
  const preloaded=await Promise.all(picked.map(name=>new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src='intro/'+encodeURIComponent(name);
  })));

  const grid=document.getElementById('photo-grid');
  const W=window.innerWidth,H=window.innerHeight;
  const maxW=Math.min(W-32,820);
  const gap=5;
  const cellW=Math.floor((maxW-(GRID_COLS-1)*gap)/GRID_COLS);
  const cellH=Math.min(Math.floor(cellW*0.72),Math.floor((H*0.9-(GRID_ROWS-1)*gap)/GRID_ROWS));
  grid.style.cssText=`grid-template-columns:repeat(${GRID_COLS},${cellW}px);gap:${gap}px;width:${GRID_COLS*cellW+(GRID_COLS-1)*gap}px;`;

  const cells=[];
  for(let i=0;i<GRID_TOTAL;i++){
    const cell=document.createElement('div');
    cell.className='grid-cell';
    const loadedImg=preloaded[i];
    if(loadedImg){
      cell.style.cssText=`width:${cellW}px;height:${cellH}px;background:#c5dff0;`;
      loadedImg.alt='';
      cell.appendChild(loadedImg);
    }else{
      cell.style.cssText=`width:${cellW}px;height:${cellH}px;background:${CELL_COLORS[i%CELL_COLORS.length]};`;
    }
    grid.appendChild(cell);
    cells.push(cell);
  }
  return cells;
}

// ── MAIN SPLASH SEQUENCE ──────────────────────────────────────
(async function(){
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const splash=document.getElementById('splash');
  const mapWrap=document.getElementById('map-wrap');
  const gridLayer=document.getElementById('grid-layer');
  const splashUI=document.getElementById('splash-ui');

  splashUI.classList.add('show');
  const logoPromise=drawLogo();
  const cellsPromise=buildGridCells();
  const targetCount=await _kidCountReady;

  await logoPromise;

  const countStart=performance.now();
  await new Promise(resolve=>{
    function frame(now){
      const t=Math.min((now-countStart)/T_COUNT,1);
      const e=easeOut4(t);
      document.getElementById('counter-num').textContent=Math.round(e*targetCount).toLocaleString();
      if(_logoFillRect){
        const fillY=-40+2128*(1-e);
        _logoFillRect.setAttribute('y',fillY);
      }
      if(t<1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });

  await sleep(200);

  splashUI.style.transition='opacity 0.5s ease';
  splashUI.style.opacity='0';
  await sleep(400);
  splashUI.style.display='none';

  const cells=await cellsPromise;
  const order=rippleOrder(GRID_COLS,GRID_ROWS);

  const revealStart=performance.now();
  await new Promise(resolve=>{
    function frame(now){
      const t=Math.min((now-revealStart)/T_REVEAL,1);
      const count=Math.round(easeOut4(t)*GRID_TOTAL);
      for(let i=0;i<count;i++) cells[order[i]]?.classList.add('visible');
      if(t<1) requestAnimationFrame(frame);
      else{cells.forEach(c=>c.classList.add('visible'));resolve();}
    }
    requestAnimationFrame(frame);
  });

  await sleep(T_HOLD);

  const exitStart=performance.now();
  await new Promise(resolve=>{
    function frame(now){
      const t=Math.min((now-exitStart)/T_EXIT,1);
      const count=Math.round(easeOut4(t)*GRID_TOTAL);
      for(let i=0;i<count;i++) cells[order[GRID_TOTAL-1-i]]?.classList.add('exit');
      if(t<1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });

  await sleep(80);
  gridLayer.style.opacity='0';

  // Reveal map — pins already placed underneath
  splash.classList.add('fade-out');
  await sleep(280);
  mapWrap.classList.add('visible');

  // Brief settle, then kick off the state fly-in
  await sleep(300);
  splash.style.display='none';

  if(window._illuminateMap&&window._kidsForIllumination)
    window._illuminateMap(window._kidsForIllumination);
})();

// ── MAP ───────────────────────────────────────────────────────
const SVG_W=960,SVG_H=600;
const PALETTE=['#004270','#00527f','#01618e','#01719e','#0378ad','#0266a5'];

function deduplicateKids(kids){
  const seen=new Set();const out=[];
  for(const k of kids){
    const key=[(k.name||'').trim().toLowerCase(),(k.age||'').toString().trim().toLowerCase(),(k.state||'').trim().toLowerCase()].join('|');
    if(!key||seen.has(key)) continue;seen.add(key);out.push(k);
  }
  return out;
}

const projection=d3.geoAlbersUsa().scale(1280).translate([SVG_W/2,SVG_H/2]);
const pathGen=d3.geoPath().projection(projection);
let currentK=1;
const svg=d3.select('#us-map');
const svgEl=document.getElementById('us-map');
const zoomGroup=d3.select('#zoom-group');

let _velX=0,_velY=0,_lastPt=null,_lastT=0,_inertiaRaf=null,_touchCount=0;
function _cancelInertia(){if(_inertiaRaf){cancelAnimationFrame(_inertiaRaf);_inertiaRaf=null;}}

// D3 zoom — defined but NOT yet bound to the SVG. Binding it registers
// mousedown/touchstart/pointerdown listeners which D3 uses to track drag state
// internally. If those listeners exist during the fly-in transition, any touch
// on the screen corrupts D3's internal __zoom state and interrupts the animation.
// We attach them only in activateInteraction(), after the intro is fully done.
const zoom=d3.zoom()
  .scaleExtent([1,12]).extent([[0,0],[SVG_W,SVG_H]])
  .translateExtent([[-SVG_W*PAN_MARGIN,-SVG_H*PAN_MARGIN],[SVG_W*(1+PAN_MARGIN),SVG_H*(1+PAN_MARGIN)]])
  .filter(event=>event.type!=='wheel')
  .on('zoom',event=>{
    currentK=event.transform.k;
    zoomGroup.attr('transform',event.transform);
    hideTip();
  });

// DO NOT call svg.call(zoom) here — attached in activateInteraction() instead.

// Zoom buttons — pointer-events:none via CSS until .ready
document.getElementById('btn-zoom-in').addEventListener('click',()=>{hideTip();svg.transition().duration(320).call(zoom.scaleBy,2);});
document.getElementById('btn-zoom-out').addEventListener('click',()=>{hideTip();svg.transition().duration(320).call(zoom.scaleBy,0.5);});
document.getElementById('btn-zoom-reset').addEventListener('click',()=>{hideTip();svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity);});

// Called ONCE — after fly-in AND outline settle. Binds D3 zoom for the first
// time (so no listener existed to intercept touch during the animation),
// attaches inertia handlers, and reveals controls.
let _activatedOnce = false;
function activateInteraction(){
  if(_activatedOnce) return;
  _activatedOnce = true;

  // NOW attach D3 zoom listeners — safe, intro is over
  svg.call(zoom);

  // Sync D3's internal __zoom state to wherever the transition landed
  svg.call(zoom.transform, d3.zoomTransform(svgEl));

  // Inertia pan
  svg.on('pointerdown.inertia',()=>{_touchCount++;_cancelInertia();_velX=0;_velY=0;_lastPt=null;})
     .on('pointermove.inertia',event=>{
       if(_touchCount>1) return;
       if(event.buttons===0&&event.pointerType!=='touch') return;
       const now=performance.now();
       if(_lastPt){const dt=Math.max(now-_lastT,1);_velX=(event.clientX-_lastPt[0])/dt;_velY=(event.clientY-_lastPt[1])/dt;}
       _lastPt=[event.clientX,event.clientY];_lastT=now;
     })
     .on('pointerup.inertia pointercancel.inertia',()=>{
       _touchCount=Math.max(0,_touchCount-1);if(_touchCount>0) return;
       if(Math.abs(_velX)<0.1&&Math.abs(_velY)<0.1) return;
       const MAX_VEL=0.6;
       _velX=Math.max(-MAX_VEL,Math.min(MAX_VEL,_velX));_velY=Math.max(-MAX_VEL,Math.min(MAX_VEL,_velY));
       const FRICTION=0.78,SCALE=10;
       function coast(){_velX*=FRICTION;_velY*=FRICTION;if(Math.abs(_velX)<0.01&&Math.abs(_velY)<0.01){_inertiaRaf=null;return;}svg.call(zoom.translateBy,_velX*SCALE,_velY*SCALE);_inertiaRaf=requestAnimationFrame(coast);}
       _inertiaRaf=requestAnimationFrame(coast);
     });

  svgEl.classList.remove('locked');
  document.getElementById('zoom-controls').classList.add('ready');
  document.getElementById('map-legend').classList.add('visible');
  if(window._positionControls) window._positionControls();
}

let mapReady=false,pendingKids=null;
window._statePaths={};

// ── STATE FOCUS / OUTLINE ─────────────────────────────────────
function focusTransformForFips(fips){
  const node=window._statePaths[fips];
  if(!node) return null;
  const b=node.getBBox();
  const k=Math.max(1,Math.min(MAX_K, FOCUS_FILL/Math.max(b.width/SVG_W,b.height/SVG_H)));
  const cx=b.x+b.width/2, cy=b.y+b.height/2;
  return d3.zoomIdentity.translate(SVG_W/2-k*cx, SVG_H/2-k*cy).scale(k);
}

function buildStateOutline(fips){
  const node=window._statePaths[fips];
  if(!node) return null;
  const d=node.getAttribute('d');
  const g=d3.select('#highlight-group');
  g.selectAll('*').remove();
  const glow=g.append('path').attr('d',d)
    .attr('fill','none').attr('stroke',OUTLINE_COLOR)
    .attr('stroke-width',9).attr('stroke-linejoin','round').attr('stroke-linecap','round')
    .style('vector-effect','non-scaling-stroke').style('opacity',0);
  const line=g.append('path').attr('d',d)
    .attr('fill','none').attr('stroke',OUTLINE_COLOR)
    .attr('stroke-width',2.6).attr('stroke-linejoin','round').attr('stroke-linecap','round')
    .style('vector-effect','non-scaling-stroke').style('opacity',0);
  return {glow,line,_revealed:false};
}

function revealOutline(refs){
  if(!refs||refs._revealed) return;
  refs._revealed=true;
  refs.line.transition().duration(900).ease(d3.easeCubicOut).style('opacity',1);
  refs.glow.transition().duration(900).ease(d3.easeCubicOut).style('opacity',0.5)
    .transition().duration(1300).style('opacity',0.18)
    .transition().duration(1300).style('opacity',0.34);
}

function startIntro(kids){
  renderMarkers(kids, false);
  const refs=buildStateOutline(FOCUS_STATE.fips);
  const tf=focusTransformForFips(FOCUS_STATE.fips);

  setTimeout(()=>{
    if(!tf){
      revealOutline(refs);
      setTimeout(activateInteraction, 1000);
      return;
    }
    hideTip();

    // Drive the fly-in by animating the zoomGroup transform directly — no D3
    // zoom listeners are attached yet, so there is literally nothing for a user
    // touch/drag to hook into. The animation cannot be interrupted.
    const startT = d3.zoomIdentity; // always starting from identity (zoom=1)
    const endT   = tf;
    const dur    = FLYIN_DUR_MS;
    const t0     = performance.now();

    function ease(t){ // cubic in-out
      return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
    }

    function flyFrame(now){
      const raw = Math.min((now - t0) / dur, 1);
      const e   = ease(raw);
      // Interpolate k, tx, ty
      const k  = startT.k  + (endT.k  - startT.k)  * e;
      const tx = startT.x  + (endT.x  - startT.x)  * e;
      const ty = startT.y  + (endT.y  - startT.y)  * e;
      zoomGroup.attr('transform', `translate(${tx},${ty}) scale(${k})`);
      currentK = k;
      if(raw < 1){
        requestAnimationFrame(flyFrame);
      } else {
        // Zoom landed — write the final exact transform
        zoomGroup.attr('transform', `translate(${endT.x},${endT.y}) scale(${endT.k})`);
        currentK = endT.k;
        // Reveal the state outline, then unlock interaction
        revealOutline(refs);
        const OUTLINE_SETTLE = 1000;
        setTimeout(activateInteraction, OUTLINE_SETTLE);
      }
    }

    requestAnimationFrame(flyFrame);

    // Absolute safety net — fires even if rAF stalls (backgrounded tab, etc.)
    setTimeout(()=>{
      zoomGroup.attr('transform', `translate(${endT.x},${endT.y}) scale(${endT.k})`);
      currentK = endT.k;
      revealOutline(refs);
      setTimeout(activateInteraction, 1000);
    }, dur + 1200);

  }, FLYIN_HOLD_MS);
}

fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
  .then(r=>r.json()).then(us=>{
    const fips2=id=>String(id).padStart(2,'0');
    const DROP_STATES=new Set(['02','15']);
    const stateFeatures=topojson.feature(us,us.objects.states).features
      .filter(d=>!DROP_STATES.has(fips2(d.id)));
    const g=d3.select('#states-group');
    g.selectAll('path.state').data(stateFeatures).enter().append('path')
      .attr('class','state').attr('d',pathGen)
      .attr('fill',(d,i)=>PALETTE[i%PALETTE.length])
      .each(function(d){window._statePaths[d.id]=this;});
    g.append('path')
      .datum(topojson.mesh(us,us.objects.states,(a,b)=>a!==b&&!DROP_STATES.has(fips2(a.id))&&!DROP_STATES.has(fips2(b.id))))
      .attr('fill','none').attr('stroke','#002d50').attr('stroke-width','0.3').attr('d',pathGen);
    window._illuminateMap=()=>{mapReady=true;if(pendingKids) startIntro(pendingKids);};
    if(window._positionControls) requestAnimationFrame(window._positionControls);
  }).catch(()=>{mapReady=true;if(pendingKids) renderMarkers(pendingKids,false);activateInteraction();});

let centroids={};
function toSVG(lat,lon){const pt=projection([lon,lat]);return pt?{x:pt[0],y:pt[1]}:null;}

// Pins always sized relative to currentK — no pre-scaling for the focused view
const BASE_PIN_R=isMobile?5.5:4.2,MIN_PIN_R=isMobile?4.5:3.0;
function getPinR(){return Math.max(MIN_PIN_R,BASE_PIN_R/currentK);}

function buildPinPositions(kids){
  const pts=[];
  kids.forEach(k=>{
    if(k.state==='AK'||k.state==='HI') return;
    const c=centroids[k.zip];let pos=null;
    if(c) pos=toSVG(c[0],c[1]);
    else if(k.lat!=null&&k.lon!=null) pos=toSVG(k.lat,k.lon);
    if(!pos) return;pts.push({kid:k,x:pos.x,y:pos.y});
  });
  const pr=getPinR(),minDist=pr*2.4;
  const svgPt=svgEl.createSVGPoint();
  const statePaths=Array.from(document.querySelectorAll('#states-group path.state'));
  function isOnLand(ax,ay){svgPt.x=ax;svgPt.y=ay;for(let sp of statePaths){if(sp.isPointInFill(svgPt)) return true;}return false;}
  for(let pass=0;pass<12;pass++){
    let moved=false;
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const dx=pts[j].x-pts[i].x,dy=pts[j].y-pts[i].y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<minDist&&dist>0){
          moved=true;
          const overlap=(minDist-dist)/2,nx=dx/dist,ny=dy/dist;
          const jx=pts[j].x+nx*overlap,jy=pts[j].y+ny*overlap;
          if(isOnLand(jx,jy)){pts[j].x=jx;pts[j].y=jy;}
          else{const ix=pts[i].x-nx*overlap,iy=pts[i].y-ny*overlap;
            if(isOnLand(ix,iy)){pts[i].x=ix;pts[i].y=iy;}
            else{const jx2=pts[j].x-ny*overlap,jy2=pts[j].y+nx*overlap;if(isOnLand(jx2,jy2)){pts[j].x=jx2;pts[j].y=jy2;}}
          }
        }
      }
    }
    if(!moved) break;
  }
  return pts;
}

function pinPath(r){
  const s=r/4.5;
  function tx(x){return(x-5.5)*s;}function ty(y){return(y-15)*s;}
  return `M${tx(5.5)},${ty(1)} C${tx(3.01)},${ty(1)} ${tx(1)},${ty(3.01)} ${tx(1)},${ty(5.5)} C${tx(1)},${ty(8.86)} ${tx(5.5)},${ty(15)} ${tx(5.5)},${ty(15)} C${tx(5.5)},${ty(15)} ${tx(10)},${ty(8.86)} ${tx(10)},${ty(5.5)} C${tx(10)},${ty(3.01)} ${tx(7.99)},${ty(1)} ${tx(5.5)},${ty(1)} Z`;
}

function dismissLegend(){ /* legend is persistent */ }

const PIN_COLOR_REGULAR='#ffffff';
const PIN_COLOR_PRIORITY='#7dd4f8';
const PIN_DOT_COLOR='#004270';

const tip=document.getElementById('pin-tip');
const tipName=document.getElementById('pin-tip-name');
const tipMeta=document.getElementById('pin-tip-meta');
let _activePin=null,_activePriority=false,_tipTimer=null;

function activatePin(gNode){
  d3.select(gNode).select('path').attr('fill','#f0a500').attr('transform','scale(1.28)');
  d3.select(gNode).select('circle').attr('fill','#c47800');
  d3.select(gNode).raise();
}
function deactivatePin(gNode,isPriority){
  const origFill=isPriority?PIN_COLOR_PRIORITY:PIN_COLOR_REGULAR;
  d3.select(gNode).select('path').attr('fill',origFill).attr('transform','');
  d3.select(gNode).select('circle').attr('fill',PIN_DOT_COLOR);
}

function buildMeta(kid){
  const bits=[];
  if(kid.age!=null&&kid.age!=='') bits.push('Age '+kid.age);
  if(kid.entryDate){
    const cls=kid.priority?' class="priority"':'';
    bits.push(`<span${cls}>Waiting since ${kid.entryDate}</span>`);
  }else{
    bits.push('Waiting for a sponsor');
  }
  return bits.join('&nbsp;&nbsp;·&nbsp;&nbsp;');
}

function positionTip(pt){
  const ctm=zoomGroup.node().getScreenCTM();
  const areaRect=document.getElementById('map-area').getBoundingClientRect();
  const screenX=ctm.a*pt.x+ctm.c*pt.y+ctm.e;
  const screenY=ctm.b*pt.x+ctm.d*pt.y+ctm.f;
  const pr=getPinR();
  const headLift=(pr*2.11+pr*0.9)*ctm.d;
  tip.style.left=screenX-areaRect.left+'px';
  tip.style.top=(screenY-areaRect.top-headLift)+'px';
}

function showTip(kid,pt,gNode,isPriority){
  if(_tipTimer){clearTimeout(_tipTimer);_tipTimer=null;}
  if(_activePin&&_activePin!==gNode) deactivatePin(_activePin,_activePriority);
  _activePin=gNode;_activePriority=isPriority;
  activatePin(gNode);
  tipName.textContent=kid.name||'';
  tipMeta.innerHTML=buildMeta(kid);
  positionTip(pt);
  tip.classList.add('active');
}
function hideTip(){
  if(_tipTimer){clearTimeout(_tipTimer);_tipTimer=null;}
  tip.classList.remove('active');
  if(_activePin){deactivatePin(_activePin,_activePriority);_activePin=null;}
}

document.getElementById('map-wrap').addEventListener('pointerdown',e=>{
  if(e.target.closest('#pins-group')) return;
  hideTip();
});

function renderMarkers(kids, animate){
  window._allKids=kids;
  hideTip();
  const layer=d3.select('#pins-group');
  layer.selectAll('*').remove();
  const positions=buildPinPositions(kids);
  const pr=getPinR(),strokeW=1.1,dotR=pr*0.38;

  const regular=positions.filter(pt=>!pt.kid.priority);
  const priority=positions.filter(pt=>pt.kid.priority);

  // Pin interaction is always live; the SVG .locked class blocks all events
  // during the intro so we don't need a separate flag here.
  function drawPin(pt,ci){
    const kid=pt.kid;
    const isPriority=!!kid.priority;
    const fillColor=isPriority?PIN_COLOR_PRIORITY:PIN_COLOR_REGULAR;
    const delay=animate?ci*8:0;
    const g=layer.append('g').attr('transform',`translate(${pt.x},${pt.y})`).style('cursor','pointer').style('opacity',animate?'0':'1');
    g.append('path').attr('d',pinPath(pr)).attr('fill',fillColor).attr('stroke','#004270').attr('stroke-width',strokeW).attr('stroke-linejoin','round').style('vector-effect','non-scaling-stroke').style('pointer-events','all').style('transition','transform .18s cubic-bezier(0.34,1.45,0.64,1)');
    g.append('circle').attr('cx',0).attr('cy',-pr*2.11).attr('r',dotR).attr('fill',PIN_DOT_COLOR).style('pointer-events','all');

    if(isMobile){
      g.on('click',e=>{
        e.stopPropagation();
        dismissLegend();
        if(_activePin===g.node()){hideTip();return;}
        showTip(kid,pt,g.node(),isPriority);
        _tipTimer=setTimeout(hideTip,3500);
      });
    }else{
      g.on('mouseenter',()=>{dismissLegend();showTip(kid,pt,g.node(),isPriority);})
       .on('mouseleave',()=>{hideTip();});
    }

    if(!animate) return;
    const dropSVG=pr*4;
    g.attr('transform',`translate(${pt.x},${pt.y-dropSVG})`);
    setTimeout(()=>{g.style('opacity','1').transition().duration(340).ease(d3.easeBackOut.overshoot(1.4)).attr('transform',`translate(${pt.x},${pt.y})`);},delay);
  }

  regular.forEach((pt,i)=>drawPin(pt,i));
  priority.forEach((pt,i)=>drawPin(pt,regular.length+i));
}

fetch('./zip_centroids.json')
  .then(r=>r.ok?r.json():{}).catch(()=>({}))
  .then(c=>{
    centroids=c;
    return fetch('./kids.json');
  })
  .then(r=>{if(!r.ok) throw new Error();return r.json();})
  .then(raw=>{
    const list=Array.isArray(raw)&&raw.length>0?deduplicateKids(raw):[];
    pendingKids=list;
    _resolveKidCount(list.length);
    const abbrToFips={'AL':'01','AZ':'04','AR':'05','CA':'06','CO':'08','CT':'09','DE':'10','FL':'12','GA':'13','ID':'16','IL':'17','IN':'18','IA':'19','KS':'20','KY':'21','LA':'22','ME':'23','MD':'24','MA':'25','MI':'26','MN':'27','MS':'28','MO':'29','MT':'30','NE':'31','NV':'32','NH':'33','NJ':'34','NM':'35','NY':'36','NC':'37','ND':'38','OH':'39','OK':'40','OR':'41','PA':'42','RI':'44','SC':'45','SD':'46','TN':'47','TX':'48','UT':'49','VT':'50','VA':'51','WA':'53','WV':'54','WI':'55','WY':'56','DC':'11'};
    const activeSet=new Set();
    list.forEach(k=>{const f=abbrToFips[k.state];if(f) activeSet.add(f);});
    window._kidsForIllumination=activeSet;
    if(mapReady) startIntro(list);
  })
  .catch(()=>{pendingKids=[];_resolveKidCount(0);window._kidsForIllumination=new Set();activateInteraction();});

// Control positioning — anchors legend+zoom just below map's drawn bottom edge
let _mapBoxVB=null;
function getMapBoxVB(){
  if(_mapBoxVB) return _mapBoxVB;
  const paths=document.querySelectorAll('#states-group path.state');
  if(!paths.length) return null;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  paths.forEach(p=>{
    const b=p.getBBox();
    if(b.x<minX)minX=b.x;if(b.y<minY)minY=b.y;
    if(b.x+b.width>maxX)maxX=b.x+b.width;if(b.y+b.height>maxY)maxY=b.y+b.height;
  });
  if(!isFinite(minX)) return null;
  _mapBoxVB={x:minX,y:minY,w:maxX-minX,h:maxY-minY};
  return _mapBoxVB;
}
function positionControls(){
  const area=document.getElementById('map-area');
  const box=getMapBoxVB();
  if(!area||!box) return;
  const rect=area.getBoundingClientRect();
  if(rect.width===0||rect.height===0) return;
  const VB_W=960,VB_H=600;
  const scale=Math.min(rect.width/VB_W, rect.height/VB_H);
  const renderH=VB_H*scale;
  const offY=(rect.height-renderH)/2;
  const mapBottomPx=offY+(box.y+box.h)*scale;
  const GAP=14;
  let fromBottom=Math.round(rect.height-mapBottomPx+GAP);
  const minFromBottom=12;
  fromBottom=Math.max(minFromBottom, Math.min(fromBottom, rect.height-60));
  const legend=document.getElementById('map-legend');
  const zc=document.getElementById('zoom-controls');
  if(legend) legend.style.bottom=fromBottom+'px';
  if(zc) zc.style.bottom=fromBottom+'px';
}
window._positionControls=positionControls;

new ResizeObserver(()=>{
  if(window._allKids) renderMarkers(window._allKids,false);
  positionControls();
}).observe(document.getElementById('map-area'));
</script>
