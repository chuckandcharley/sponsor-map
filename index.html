<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playhouse Map</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=source-sans-3:600,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#004270;--blue:#0378ad;--white:#fff;
  --modal-bg:#003056;--modal-surface:#00243f;
  --modal-border:rgba(3,120,173,0.32);
  --modal-text:#e4f0fb;--modal-muted:#6fa8c8;
  --fact-bg:rgba(3,120,173,0.11);--fact-border:rgba(3,120,173,0.2);
  --ff:'Franklin Gothic Medium','Franklin Gothic','ITC Franklin Gothic','Source Sans 3','Arial Narrow',Arial,sans-serif;
}
html,body{overflow:hidden;background:transparent;width:100%;margin:0;padding:0}
body{font-family:var(--ff)}
#map-wrap{position:relative;width:100%;max-width:1200px;margin:0 auto;user-select:none}
svg#us-map{width:100%;height:auto;display:block;overflow:visible}
#markers-layer{position:absolute;inset:0;pointer-events:none;overflow:visible}
.state{stroke:#002d50;stroke-width:0.5;stroke-linejoin:round;transition:filter .15s}
.state:hover{filter:brightness(1.12)}

/* Pin — wrapper never transforms, only inner svg animates */
.pin-btn{
  position:absolute;
  pointer-events:all;cursor:pointer;
  background:none;border:none;padding:0;outline:none;z-index:10;
  opacity:1;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  /* anchor: bottom-center of house sits on the coordinate */
  transform:translate(-50%, -100%);
}
.pin-svg{
  display:block;width:var(--pin-w,11px);height:var(--pin-h,16px);
  transform-origin:50% 100%;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  will-change:transform;overflow:visible;
}
@media(hover:hover){.pin-btn:hover .pin-svg{transform:scale(1.3)}}
.pin-btn:active .pin-svg{transform:scale(1.2)}
@keyframes pinRipple{
  0%{transform:scale(1);opacity:0.9;}
  100%{transform:scale(5.5);opacity:0;}
}

/* Modal — anchored by % within map so it stays put as map scales */
#modal-card{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:clamp(160px,24%,230px);
  max-height:90%;
  display:flex;
  flex-direction:column;
  background:#ffffff;
  border-radius:12px;
  font-family:var(--ff);
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
  overflow:hidden;
}

.modal-body{
  flex:1 1 auto;
  overflow-y:auto;
  padding:14px 14px 8px;
  min-height:0;
  -webkit-overflow-scrolling:touch;
}
.modal-footer{
  flex-shrink:0;
  padding:8px 14px 14px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
#modal-card.active{opacity:1;pointer-events:all}

.modal-accent{height:2px;background:linear-gradient(90deg,transparent,var(--blue) 30%,var(--blue) 70%,transparent);opacity:.6}
.modal-logo{display:flex;align-items:center;justify-content:center;padding:10px 14px 9px;background:var(--modal-surface);border-bottom:1px solid rgba(3,120,173,.12)}
.modal-logo svg{width:44px;height:auto}

.modal-eyebrow{font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.modal-name{font-size:17px;font-weight:700;color:var(--navy);line-height:1.2;margin-bottom:10px}
.modal-facts{display:flex;flex-direction:column;gap:6px}
.modal-fact{background:#f0f7fc;border:1px solid #cde4f0;border-radius:6px;padding:6px 8px;display:flex;align-items:flex-start;gap:6px}
.fact-icon{width:17px;height:17px;border-radius:4px;background:rgba(3,120,173,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.fact-icon svg{width:9px;height:9px;fill:var(--blue)}
.fact-label{font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5a8fa8;line-height:1.3}
.fact-value{font-size:12px;color:#003050;line-height:1.3;margin-top:1px}
/* modal-footer now in #modal-card block above */
.btn{display:block;width:100%;padding:8px 10px;border-radius:6px;font-size:10.5px;font-weight:700;font-family:var(--ff);letter-spacing:.04em;text-align:center;text-decoration:none;cursor:pointer;border:1.5px solid transparent;transition:background .13s,border-color .13s,transform .1s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:var(--white);border-color:var(--blue)}
.btn-primary:hover{background:#025f8a;border-color:#025f8a}
.btn-secondary{background:transparent;color:var(--modal-text);border-color:rgba(3,120,173,.4)}
.btn-secondary:hover{background:rgba(3,120,173,.13);border-color:var(--blue)}
#map-loading{display:none}
</style>
</head>
<body>

095 247.438 499.472 129.959 681.117 65.653 C 731.223 47.9144 781.998 36.1015 833.543 24.9457 z"/>
        <path fill="rgb(9,65,110)" d="M 1578.15 1497.09 C 1591.87 1495.21 1617.98 1486.66 1632.23 1482.23 C 1735.48 1450.16 1835.81 1403.16 1929.94 1350.25 C 1949.84 1339.07 1978.73 1324.16 1997.27 1311.94 C 1935.64 1527.69 1822.63 1685.85 1650.29 1827.78 C 1538.49 1916.33 1409.1 1980.06 1270.75 2014.7 C 1248.92 2020.8 1226.39 2025.2 1204.03 2029.08 C 1016.65 2061.61 817.98 2043.84 641.545 1971.7 C 622.351 1963.85 603.947 1953.58 584.547 1946.16 C 605.05 1946.37 619.357 1945.11 639.565 1943.87 C 713.025 1939.33 796.058 1929.49 867.636 1912.09 C 929.61 1897.58 990.409 1878.44 1049.52 1854.85 C 1195.98 1795.4 1337.42 1692.05 1423.23 1557.96 C 1433.27 1542.27 1441.79 1525.58 1451.48 1509.66 C 1458.09 1508.81 1465.66 1508.43 1472.38 1507.93 C 1507.48 1508.75 1543.75 1503.65 1578.15 1497.09 z"/>
        <path fill="rgb(9,65,110)" d="M 694.74 1327.94 C 641.237 1264.32 606.51 1187.06 594.451 1104.81 C 554.736 847.323 753.586 604.414 1016.21 598.583 C 1039.54 598.065 1073.08 599.231 1095.85 602.431 C 1194 616.218 1280.25 662.068 1349.24 732.662 C 1419.07 804.113 1457.69 887.05 1471.66 985.897 C 1477.07 1023.89 1476.23 1076.88 1468.26 1114.58 C 1459.99 1168.8 1434.18 1234.72 1403.99 1279.92 C 1394.53 1294.09 1383.66 1307.87 1373.95 1322.16 C 1375.57 1307.72 1374.9 1289.42 1374.87 1274.57 L 1374.77 1200.49 L 1374.73 1063.04 C 1374.58 1046.04 1374.97 1027.71 1374.22 1010.96 C 1386.32 1010.29 1412.48 1009.1 1423.83 1009.92 L 1038.83 690.576 C 1012.55 704.352 986.156 727.614 962.452 746.191 L 876.838 812.166 C 877.935 799.701 877.109 775.311 877.229 761.705 C 871.514 761.982 864.853 761.847 859.133 761.612 C 836.383 760.674 812.748 762.192 790.117 760.666 C 789.624 800.654 793.297 847.877 788.054 886.686 C 781.804 894.124 757.729 914.911 749.423 921.906 C 714.195 951.576 675.294 986.753 638.682 1014.13 C 656.809 1013.44 676.669 1013.84 694.925 1013.86 C 694.191 1025.15 694.799 1043.16 694.807 1054.82 L 694.673 1129.88 L 694.91 1268.67 C 694.959 1288.24 694.316 1308.59 694.74 1327.94 z"/>
      </svg>
    </div>
    <div class="modal-body">
      <div class="modal-eyebrow">Waiting for a Sponsor</div>
      <div class="modal-name" id="modal-name">&#8212;</div>
      <div class="modal-facts">
        <div class="modal-fact">
          <div class="fact-icon"><svg viewBox="0 0 16 16"><path d="M8 1a3.5 3.5 0 1 0 0 7A3.5 3.5 0 0 0 8 1zM5.5 4.5a2.5 2.5 0 1 1 5 0 2.5 2.5 0 0 1-5 0zM6 9l-1.5 6h7L10 9H6z"/></svg></div>
          <div><div class="fact-label">Age</div><div class="fact-value" id="modal-age">&#8212;</div></div>
        </div>
        <div class="modal-fact">
          <div class="fact-icon"><svg viewBox="0 0 16 16"><path d="M8 1a5 5 0 0 0-5 5c0 3.5 5 9 5 9s5-5.5 5-9a5 5 0 0 0-5-5zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg></div>
          <div><div class="fact-label">Location</div><div class="fact-value" id="modal-location">&#8212;</div></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <a href="#" class="btn btn-primary">Sponsor This Kiddo</a>
      <a href="#" class="btn btn-secondary">Help Support</a>
    </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const SVG_W=960,SVG_H=600,ALASKA="02",HAWAII=15;
const PALETTE=["#004270","#00527f","#01618e","#01719e","#0378ad","#0266a5"];
const projection=d3.geoAlbersUsa().scale(1280).translate([SVG_W/2,SVG_H/2]);
const pathGen=d3.geoPath().projection(projection);
let mapReady=false,pendingKids=null,allPins=[];

fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json")
  .then(r=>r.json()).then(us=>{
    const states=topojson.feature(us,us.objects.states);
    const filtered={type:"FeatureCollection",features:states.features.filter(f=>f.id!==ALASKA)};
    const g=d3.select("#states-group");
    // Build a set of states that have waiting kids — will be populated when kids load
    window._activeStates = new Set();
    window._statePaths = {};

    const stateFeatures = filtered.features.filter(d=>d.id!==ALASKA&&d.id!==10&&String(d.id)!=='15');

    g.selectAll("path.state")
      .data(stateFeatures)
      .enter().append("path")
      .attr("class","state")
      .attr("d",pathGen)
      .attr("fill",(d,i)=>PALETTE[i%PALETTE.length])
      .attr("data-fips", d=>d.id)
      .each(function(d,i){
        const el=this;
        window._statePaths[d.id]=el;
        el.style.opacity='0';
        el.style.transition='none';
      });

    // Border mesh — starts invisible
    const borderPath = g.append("path")
      .datum(topojson.mesh(us,us.objects.states,(a,b)=>a!==b&&a.id!==ALASKA&&a.id!==10&&b.id!==10&&String(a.id)!=='15'&&String(b.id)!=='15'))
      .attr("fill","none").attr("stroke","#002d50").attr("stroke-width","0.3").attr("d",pathGen)
      .style("opacity","0");



    // STATE ILLUMINATION — staggered fade up, active states full, inactive muted
    // Runs after kids data is ready via window._illuminateMap()
    const STATE_ANIM_MS = 2600;
    window._illuminateMap = function(activeSet) {
      stateFeatures.forEach((d,i)=>{
        const el = window._statePaths[d.id];
        if(!el) return;
        const isActive = activeSet.has(String(d.id));
        const targetOpacity = '1';
        setTimeout(()=>{
          el.style.transition=`opacity 0.7s ease`;
          el.style.opacity=targetOpacity;
        }, 40 + i*46);
      });
      // Borders breathe in near the end
      setTimeout(()=>{
        borderPath.style("opacity","0")
          .transition().duration(600).style("opacity","1");
      }, STATE_ANIM_MS - 400);
      // Pins after map settles
      setTimeout(()=>{
        mapReady=true;
        if(pendingKids) renderMarkers(pendingKids);
      }, STATE_ANIM_MS);
    };

    // If kids already loaded before map, illuminate now
    if(window._kidsForIllumination){
      window._illuminateMap(window._kidsForIllumination);
    }
  }).catch(()=>{
    
    mapReady=true;if(pendingKids)renderMarkers(pendingKids);
  });

async function loadCentroids(){
  try{
    const r=await fetch('./zip_centroids.json');
    if(!r.ok) return {};
    return await r.json();
  }catch(e){return {}}
}
let centroids={};

// Scale pins relative to map render width so they stay proportional on all devices
function updatePinScale(){
  const wrap = document.getElementById('map-wrap');
  if(!wrap) return;
  const w = wrap.getBoundingClientRect().width;
  // At 960px (design width) pins are 11x16. Scale linearly, clamp 6–14px wide.
  const scale = Math.min(Math.max(w / 960, 0.55), 1.2);
  const pw = Math.round(11 * scale);
  const ph = Math.round(16 * scale);
  wrap.style.setProperty('--pin-w', pw+'px');
  wrap.style.setProperty('--pin-h', ph+'px');
}
const _ro = new ResizeObserver(updatePinScale);
_ro.observe(document.getElementById('map-wrap'));
updatePinScale();
loadCentroids().then(data=>{
  centroids=data;
});

function project(lat,lon){const pt=projection([lon,lat]);return pt?{x:pt[0]/SVG_W*100,y:pt[1]/SVG_H*100}:null}

function scatter(kids){
  const byZip={};
  kids.forEach(k=>{(byZip[k.zip]=byZip[k.zip]||[]).push(k)});
  kids.forEach(k=>{
    const c=centroids[k.zip];
    if(c){k.lat=c[0];k.lon=c[1];}
    const raw=project(k.lat,k.lon);
    if(!raw){k._px=null;k._py=null;return}
    const grp=byZip[k.zip],idx=grp.indexOf(k);
    if(grp.length===1){k._px=raw.x;k._py=raw.y;return}
    const r=grp.length>15?0.4:grp.length>8?0.6:0.85;
    const a=(idx/grp.length)*2*Math.PI-Math.PI/2;
    k._px=Math.max(3,Math.min(96,raw.x+Math.cos(a)*r));
    k._py=Math.max(3,Math.min(93,raw.y+Math.sin(a)*r));
  });
}

function renderMarkers(kids){
  const layer=document.getElementById('markers-layer');
  layer.innerHTML='';allPins=[];
  scatter(kids);
  kids.forEach((kid,i)=>{
    if(kid._px===null) return;
    if(kid.state==='AK'||kid.state==='HI') return;
    const btn=document.createElement('button');
    btn.className='pin-btn';
    btn.style.left=kid._px+'%';
    btn.style.top=kid._py+'%';
    btn.setAttribute('aria-label','View '+kid.name+"'s story");
    btn.innerHTML=`<svg class="pin-svg" viewBox="0 0 11 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M5.5,1 C3.01,1 1,3.01 1,5.5 C1,8.86 5.5,15 5.5,15 C5.5,15 10,8.86 10,5.5 C10,3.01 7.99,1 5.5,1 Z"
            fill="#ffffff" stroke="#004270" stroke-width="1.1" stroke-linejoin="round"/>
      <circle cx="5.5" cy="5.5" r="1.8" fill="#004270"/>
    </svg>`;
    btn.addEventListener('click',e=>{e.stopPropagation();openModal(kid)});
    layer.appendChild(btn);
    allPins.push(btn);
    // Entrance: fade up softly, staggered
    const pinSvg = btn.querySelector('.pin-svg');
    pinSvg.style.opacity='0';
    pinSvg.style.transform='scale(0.4)';
    pinSvg.style.transition='none';
    const entryDelay = i * 22;
    setTimeout(()=>{
      pinSvg.style.transition=`opacity 0.35s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1)`;
      pinSvg.style.opacity='1';
      pinSvg.style.transform='scale(1)';
      // Heartbeat ripple after pin appears
      setTimeout(()=>{
        const ripple=document.createElement('div');
        ripple.style.cssText=`
          position:absolute;
          left:50%;top:50%;
          width:6px;height:6px;
          margin:-3px 0 0 -3px;
          border-radius:50%;
          border:1.5px solid #d0e8f5;
          pointer-events:none;
          animation:pinRipple 0.9s ease-out forwards;
          z-index:5;
        `;
        btn.appendChild(ripple);
        setTimeout(()=>ripple.remove(), 950);
      }, 380);
    }, entryDelay);
  });
}

function fadePinsOut(cb){
  allPins.forEach(p=>{p.style.transition='opacity .2s ease';p.style.opacity='0';p.style.pointerEvents='none'});
  setTimeout(cb,220);
}
function fadePinsIn(){
  allPins.forEach(p=>{p.style.transition='opacity .2s ease';p.style.opacity='1';p.style.pointerEvents='all'});
}

const card=document.getElementById('modal-card');
let isOpen=false;

function openModal(kid){
  if(isOpen)return;isOpen=true;
  document.getElementById('modal-name').textContent=kid.name;
  document.getElementById('modal-age').textContent=kid.age;
  document.getElementById('modal-location').textContent=kid.city&&kid.state?kid.city+', '+kid.state:kid.state||'';
  fadePinsOut(()=>card.classList.add('active'));
}
function closeModal(){
  if(!isOpen)return;isOpen=false;
  card.classList.remove('active');
  setTimeout(fadePinsIn,230);
}

document.getElementById('map-wrap').addEventListener('click',()=>{if(isOpen)closeModal()});
card.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

const PLACEHOLDER=[];

fetch('./zip_centroids.json')
  .then(r=>r.ok?r.json():{})
  .catch(()=>({}))
  .then(c=>{
    centroids=c;
    return fetch('./kids.json');
  })
  .then(r=>{if(!r.ok)throw new Error();return r.json()})
  .then(kids=>{
    const list = (Array.isArray(kids)&&kids.length>0) ? kids : PLACEHOLDER;
    pendingKids = list;
    // Build state abbreviation -> FIPS lookup for illumination
    const abbrToFips = {
      'AL':'01','AZ':'04','AR':'05','CA':'06','CO':'08','CT':'09','DE':'10',
      'FL':'12','GA':'13','ID':'16','IL':'17','IN':'18','IA':'19','KS':'20',
      'KY':'21','LA':'22','ME':'23','MD':'24','MA':'25','MI':'26','MN':'27',
      'MS':'28','MO':'29','MT':'30','NE':'31','NV':'32','NH':'33','NJ':'34',
      'NM':'35','NY':'36','NC':'37','ND':'38','OH':'39','OK':'40','OR':'41',
      'PA':'42','RI':'44','SC':'45','SD':'46','TN':'47','TX':'48','UT':'49',
      'VT':'50','VA':'51','WA':'53','WV':'54','WI':'55','WY':'56','DC':'11'
    };
    const activeSet = new Set();
    list.forEach(k=>{
      const fips = abbrToFips[k.state];
      if(fips) activeSet.add(fips);
    });
    // Pass to map — either it's ready or we store for when it is
    if(window._illuminateMap){
      window._illuminateMap(activeSet);
    } else {
      window._kidsForIllumination = activeSet;
    }
  })
  .catch(()=>{
    pendingKids=PLACEHOLDER;
    if(window._illuminateMap) window._illuminateMap(new Set());
    else window._kidsForIllumination=new Set();
  });
</script>
</body>
</html>
