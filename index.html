<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Playhouse Map</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=source-sans-3:400,600,700,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#004270;--blue:#0378ad;--white:#fff;--bg:#f3f9fd;
  --ff:'Source Sans 3','Arial Narrow',Arial,sans-serif;
}
html,body{width:100%;height:100%;margin:0;padding:0;background:var(--bg);overflow:hidden;font-family:var(--ff)}
body{display:flex;flex-direction:column;}

/* ── MAP WRAP ── */
#map-wrap{
  position:relative;width:100%;max-width:1200px;margin:0 auto;
  user-select:none;-webkit-user-select:none;flex:1;display:flex;flex-direction:column;
  opacity:0;transition:opacity 1.2s ease;
}
#map-wrap.visible{opacity:1}

/* Ghost mosaic sits at z-index 0, below everything in the map */
#ghost-mosaic{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  opacity:0;transition:opacity 1.4s ease;
  filter:saturate(0.15) brightness(1.14);
  overflow:hidden;
}
#ghost-mosaic .tile{opacity:1;transform:scale(1);}

/* SVG map sits above ghost */
svg#us-map{
  position:relative;z-index:1;
  width:100%;height:auto;display:block;flex:1;cursor:grab;touch-action:none;
}
svg#us-map:active{cursor:grabbing}
.state{stroke:#002d50;stroke-width:0.5;stroke-linejoin:round}

/* Modal */
#modal-card{
  position:absolute;left:50%;top:50%;z-index:50;
  transform:translate(-50%,-50%) scale(0.92);
  width:260px;display:flex;flex-direction:column;
  background:#fff;border-radius:16px;font-family:var(--ff);
  opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s cubic-bezier(0.34,1.56,0.64,1);
  overflow:hidden;
  box-shadow:0 8px 40px rgba(0,42,70,.22),0 2px 8px rgba(0,42,70,.10);
}
#modal-card.active{opacity:1;pointer-events:all;transform:translate(-50%,-50%) scale(1);}
#modal-top{background:var(--navy);padding:20px 20px 16px;}
#modal-waiting{font-size:7px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:6px;}
#modal-name{font-size:17px;font-weight:600;letter-spacing:-0.01em;color:#fff;line-height:1.15;margin:0;}
#modal-meta{font-size:11px;color:rgba(255,255,255,0.55);margin-top:5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#modal-footer{padding:14px 20px 18px;display:flex;flex-direction:column;gap:8px;background:#fff;}
.btn{display:block;width:100%;padding:7px 10px;border-radius:6px;font-size:10px;font-weight:700;font-family:var(--ff);letter-spacing:.06em;text-transform:uppercase;text-align:center;text-decoration:none;cursor:pointer;border:2px solid transparent;transition:background .15s,transform .1s,box-shadow .15s;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 2px 8px rgba(0,42,70,.18);}
.btn-primary:hover{background:#003258;border-color:#003258;}
.btn-secondary{background:#fff;color:var(--navy);border-color:#cde4f0;}
.btn-secondary:hover{background:#f0f7fc;border-color:var(--navy);}

/* Zoom controls */
#zoom-controls{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:30;transition:opacity .3s ease;}
.zoom-btn{width:32px;height:32px;background:#fff;border:1.5px solid #cde4f0;border-radius:8px;font-size:18px;font-weight:700;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,42,70,.12);transition:background .12s,transform .1s;-webkit-tap-highlight-color:transparent;font-family:var(--ff)}
.zoom-btn:hover{background:#f0f7fc}
.zoom-btn:active{transform:scale(.93)}

/* Legend */
#map-legend{
  position:absolute;bottom:16px;left:16px;z-index:30;
  background:#fff;border:1.5px solid #cde4f0;border-radius:10px;
  padding:9px 13px 9px 11px;
  display:flex;align-items:flex-start;gap:8px;
  box-shadow:0 2px 8px rgba(0,42,70,.10);
  font-family:var(--ff);
  opacity:0;transition:opacity 0.6s ease;
  max-width:180px;
}
#map-legend.visible{opacity:1;}
#legend-pin{flex-shrink:0;margin-top:1px;}
#legend-text{display:flex;flex-direction:column;gap:2px;}
#legend-main{font-size:11px;font-weight:700;color:var(--navy);line-height:1.3;letter-spacing:.01em;}
#legend-sub{font-size:9.5px;font-weight:600;color:#0378ad;letter-spacing:.04em;text-transform:uppercase;}

/* ── SPLASH ── */
#splash{
  position:fixed;inset:0;z-index:100;overflow:hidden;
  background:var(--bg);pointer-events:none;
  transition:opacity 1.3s ease;
}
#splash.fade-out{opacity:0;}

#mosaic-layer{position:absolute;inset:0;pointer-events:none;z-index:1;}
.tile{position:absolute;overflow:hidden;opacity:0;transform:scale(0.72);transition:opacity 0.38s ease,transform 0.38s cubic-bezier(0.34,1.56,0.64,1);}
.tile.visible{opacity:1;transform:scale(1);}
.tile img{width:100%;height:100%;object-fit:cover;display:block;}

#edge-fade{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse 66% 56% at 50% 50%,
    transparent 25%,rgba(243,249,253,0.45) 55%,rgba(243,249,253,0.88) 78%,#f3f9fd 100%);
}

#splash-ui{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;
}
#logo-svg-wrap{margin-bottom:20px;}
#num-clip{overflow:visible;line-height:1;width:100%;text-align:center;padding:0 20px;}
#counter-num{
  display:block;font-size:clamp(72px,16vw,180px);font-weight:900;
  letter-spacing:-0.04em;color:var(--navy);font-variant-numeric:tabular-nums;
  line-height:1;text-align:center;white-space:nowrap;
  opacity:0;transition:opacity 0.4s ease;
}
#counter-num.show{opacity:1;}
#label-clip{overflow:hidden;line-height:1;margin-top:.1em;width:100%;text-align:center;padding:0 20px;}
#counter-label{
  display:block;font-size:clamp(13px,2.4vw,32px);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--navy);
  line-height:1;text-align:center;white-space:nowrap;
  opacity:0;transition:opacity 0.5s ease;
}
#counter-label.show{opacity:1;}
</style>
</head>

// ── SEEDED RANDOM — fresh every page load ─────────────────────
function mulberry32(s){
  return function(){
    s|=0; s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
const rng=mulberry32(Math.floor(Math.random()*2147483647));
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const shuffledPhotos=shuffle(PHOTO_FILES);

// ── TILE GRID ─────────────────────────────────────────────────
const TILE_SIZE=isMobile?88:108;
function buildTileGrid(containerEl,photoOffset){
  const W=window.innerWidth,H=window.innerHeight;
  const cols=Math.ceil(W/TILE_SIZE)+2,rows=Math.ceil(H/TILE_SIZE)+2;
  const tiles=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
    tiles.push({x:(c-.5)*TILE_SIZE,y:(r-.5)*TILE_SIZE,cx:(c-.5)*TILE_SIZE+TILE_SIZE/2,cy:(r-.5)*TILE_SIZE+TILE_SIZE/2});
  const cx=W/2,cy=H/2;
  tiles.sort((a,b)=>((a.cx-cx)**2+(a.cy-cy)**2)-((b.cx-cx)**2+(b.cy-cy)**2));
  const BAND=6;
  for(let i=0;i<tiles.length;i+=BAND){
    const s=tiles.slice(i,i+BAND);
    for(let j=s.length-1;j>0;j--){ const k=Math.floor(rng()*(j+1)); [s[j],s[k]]=[s[k],s[j]]; }
    tiles.splice(i,BAND,...s);
  }
  containerEl.innerHTML='';
  const frag=document.createDocumentFragment();
  tiles.forEach((t,i)=>{
    const div=document.createElement('div');
    div.className='tile';
    div.style.cssText=`left:${t.x}px;top:${t.y}px;width:${TILE_SIZE}px;height:${TILE_SIZE}px;`;
    const img=document.createElement('img');
    img.src='intro/'+encodeURIComponent(shuffledPhotos[(i+photoOffset)%shuffledPhotos.length]);
    img.alt='';img.loading='eager';
    div.appendChild(img);frag.appendChild(div);
  });
  containerEl.appendChild(frag);
  return containerEl.querySelectorAll('.tile');
}

const splashTiles=buildTileGrid(document.getElementById('mosaic-layer'),0);
const ghostLayer=document.getElementById('ghost-mosaic');
buildTileGrid(ghostLayer,Math.floor(shuffledPhotos.length/2));
ghostLayer.querySelectorAll('.tile').forEach(t=>{t.style.opacity='1';t.style.transform='scale(1)';});

// Returns a promise that resolves when stroke draw is done.
// fillRectEl is passed in so the counter loop can drive its y position.
let _logoFillRect=null;
function drawLogo(){
  return new Promise(resolve=>{
    const ns='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','-40 -40 2080 2128');
    svg.setAttribute('width',isMobile?'70':'90');
    svg.setAttribute('height',isMobile?'70':'90');
    svg.style.cssText='display:block;overflow:visible;';
    const defs=document.createElementNS(ns,'defs');
    const clip=document.createElementNS(ns,'clipPath');
    clip.setAttribute('id','lfc');
    const rect=document.createElementNS(ns,'rect');
    rect.setAttribute('x','-40');rect.setAttribute('y','2088');
    rect.setAttribute('width','2080');rect.setAttribute('height','2128');
    _logoFillRect=rect; // expose so counter can drive it
    clip.appendChild(rect);defs.appendChild(clip);svg.appendChild(defs);

    const strokeEls=LOGO_PATHS.map(d=>{
      const p=document.createElementNS(ns,'path');
      p.setAttribute('d',d);
      p.style.cssText='fill:none;stroke:#004270;stroke-width:28;stroke-linecap:round;stroke-linejoin:round;';
      svg.appendChild(p);return p;
    });
    const fillG=document.createElementNS(ns,'g');
    fillG.setAttribute('clip-path','url(#lfc)');
    LOGO_PATHS.forEach(d=>{
      const p=document.createElementNS(ns,'path');
      p.setAttribute('d',d);p.style.cssText='fill:#004270;stroke:none;';
      fillG.appendChild(p);
    });
    svg.appendChild(fillG);
    document.getElementById('logo-svg-wrap').appendChild(svg);

    const lens=strokeEls.map(el=>el.getTotalLength());
    strokeEls.forEach((el,i)=>{ el.style.strokeDasharray=lens[i]; el.style.strokeDashoffset=lens[i]; });

    const DRAW_MS=1400,STAGGER=180;
    strokeEls.forEach((el,i)=>{
      setTimeout(()=>{
        el.style.transition=`stroke-dashoffset ${DRAW_MS}ms cubic-bezier(0.4,0,0.2,1)`;
        el.style.strokeDashoffset='0';
      },i*STAGGER+60);
    });
    setTimeout(resolve,STAGGER*LOGO_PATHS.length+DRAW_MS+60);
  });
}

// ── KID COUNT PROMISE ─────────────────────────────────────────
let _resolveKidCount;
const _kidCountReady=new Promise(r=>{ _resolveKidCount=r; });

// ── COUNTER + MOSAIC + LOGO FILL — all driven by one loop ─────
const COUNTER_MS=2600;
const MOSAIC_FIRST_MS=2600;
const MOSAIC_TRICKLE_MS=800;
const TOTAL_TILES=splashTiles.length;
function easeOut4(t){ return 1-Math.pow(1-t,4); }

function runCounterAndMosaic(targetCount){
  const numEl=document.getElementById('counter-num');
  const labelEl=document.getElementById('counter-label');
  numEl.classList.add('show');
  labelEl.classList.add('show');

  const BREAK=0.70;
  const FIRST_COUNT=Math.floor(TOTAL_TILES*BREAK);
  const start=performance.now();

  function frame(now){
    const elapsed=now-start;
    const ct=Math.min(elapsed/COUNTER_MS,1);
    const easedT=easeOut4(ct);

    // counter number
    numEl.textContent=Math.round(easedT*targetCount).toLocaleString();

    // logo fill — driven by exact same eased progress as counter
    // floods from bottom (y=2088) to top (y=-40) as count goes 0→1
    if(_logoFillRect){
      const fillY=-40+2128*(1-easedT);
      _logoFillRect.setAttribute('y',fillY);
    }

    // mosaic first 70% during count
    if(elapsed<=MOSAIC_FIRST_MS){
      const reveal=Math.round(easeOut4(elapsed/MOSAIC_FIRST_MS)*FIRST_COUNT);
      for(let i=0;i<reveal;i++) splashTiles[i].classList.add('visible');
    } else {
      for(let i=0;i<FIRST_COUNT;i++) splashTiles[i].classList.add('visible');
      const tt=Math.min((elapsed-MOSAIC_FIRST_MS)/MOSAIC_TRICKLE_MS,1);
      const reveal=FIRST_COUNT+Math.round(easeOut4(tt)*(TOTAL_TILES-FIRST_COUNT));
      for(let i=FIRST_COUNT;i<reveal;i++) splashTiles[i].classList.add('visible');
    }

    if(elapsed<Math.max(COUNTER_MS,MOSAIC_FIRST_MS+MOSAIC_TRICKLE_MS))
      requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ── SPLASH SEQUENCE ───────────────────────────────────────────
(async function(){
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const splash=document.getElementById('splash');
  const mapWrap=document.getElementById('map-wrap');
  const ghost=document.getElementById('ghost-mosaic');
  const legend=document.getElementById('map-legend');

  await drawLogo();
  await sleep(100);

  const targetCount=await _kidCountReady;
  runCounterAndMosaic(targetCount);

  await sleep(COUNTER_MS+MOSAIC_TRICKLE_MS+700);

  splash.classList.add('fade-out');
  await sleep(500);
  mapWrap.classList.add('visible');
  ghost.style.opacity='0.10';

  // Legend fades in shortly after map appears
  setTimeout(()=>legend.classList.add('visible'),600);

  await sleep(900);
  splash.style.display='none';

  if(window._illuminateMap&&window._kidsForIllumination)
    window._illuminateMap(window._kidsForIllumination);
})();

// ── MAP ───────────────────────────────────────────────────────
const SVG_W=960,SVG_H=600;
const ALASKA='02',HAWAII=15;
const PALETTE=['#004270','#00527f','#01618e','#01719e','#0378ad','#0266a5'];
const URL_SPONSOR='https://give.rocsolidfoundation.org/campaign/799349/donate';

function deduplicateKids(kids){
  const seen=new Set();const out=[];
  for(const k of kids){
    const key=[(k.name||'').trim().toLowerCase(),(k.age||'').toString().trim().toLowerCase(),(k.state||'').trim().toLowerCase()].join('|');
    if(!key||seen.has(key)) continue;seen.add(key);out.push(k);
  }
  return out;
}

const projection=d3.geoAlbersUsa().scale(1280).translate([SVG_W/2,SVG_H/2]);
const pathGen=d3.geoPath().projection(projection);
let currentK=1;
const svg=d3.select('#us-map');
const svgEl=document.getElementById('us-map');
const zoomGroup=d3.select('#zoom-group');
let lastReclusterK=1;

let _velX=0,_velY=0,_lastPt=null,_lastT=0,_inertiaRaf=null,_touchCount=0;
function _cancelInertia(){ if(_inertiaRaf){cancelAnimationFrame(_inertiaRaf);_inertiaRaf=null;} }

const zoom=d3.zoom()
  .scaleExtent([1,12]).extent([[0,0],[SVG_W,SVG_H]]).translateExtent([[0,0],[SVG_W,SVG_H]])
  .filter(event=>{ if(event.type==='wheel') return false;return true; })
  .on('zoom',event=>{
    currentK=event.transform.k;zoomGroup.attr('transform',event.transform);
    clearTimeout(window._reclusterTimer);
    window._reclusterTimer=setTimeout(()=>{
      if(window._allKids&&Math.abs(currentK-lastReclusterK)/lastReclusterK>0.15){
        lastReclusterK=currentK;renderMarkers(window._allKids,false);
      }
    },80);
  });
svg.call(zoom);
svg.on('pointerdown.inertia',()=>{_touchCount++;_cancelInertia();_velX=0;_velY=0;_lastPt=null;})
   .on('pointermove.inertia',event=>{
     if(_touchCount>1) return;
     if(event.buttons===0&&event.pointerType!=='touch') return;
     const now=performance.now();
     if(_lastPt){const dt=Math.max(now-_lastT,1);_velX=(event.clientX-_lastPt[0])/dt;_velY=(event.clientY-_lastPt[1])/dt;}
     _lastPt=[event.clientX,event.clientY];_lastT=now;
   })
   .on('pointerup.inertia pointercancel.inertia',()=>{
     _touchCount=Math.max(0,_touchCount-1);if(_touchCount>0) return;
     if(Math.abs(_velX)<0.1&&Math.abs(_velY)<0.1) return;
     const MAX_VEL=0.6;
     _velX=Math.max(-MAX_VEL,Math.min(MAX_VEL,_velX));_velY=Math.max(-MAX_VEL,Math.min(MAX_VEL,_velY));
     const FRICTION=0.78,SCALE=10;
     function coast(){_velX*=FRICTION;_velY*=FRICTION;if(Math.abs(_velX)<0.01&&Math.abs(_velY)<0.01){_inertiaRaf=null;return;}svg.call(zoom.translateBy,_velX*SCALE,_velY*SCALE);_inertiaRaf=requestAnimationFrame(coast);}
     _inertiaRaf=requestAnimationFrame(coast);
   });

document.getElementById('btn-zoom-in').addEventListener('click',()=>{svg.transition().duration(320).call(zoom.scaleBy,2);});
document.getElementById('btn-zoom-out').addEventListener('click',()=>{svg.transition().duration(320).call(zoom.scaleBy,0.5);});
document.getElementById('btn-zoom-reset').addEventListener('click',()=>{svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity);});

let mapReady=false,pendingKids=null;
window._statePaths={};

fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
  .then(r=>r.json()).then(us=>{
    const stateFeatures=topojson.feature(us,us.objects.states).features
      .filter(d=>String(d.id)!==ALASKA&&d.id!==10&&String(d.id)!=='15');
    const g=d3.select('#states-group');
    g.selectAll('path.state').data(stateFeatures).enter().append('path')
      .attr('class','state').attr('d',pathGen)
      .attr('fill',(d,i)=>PALETTE[i%PALETTE.length])
      .each(function(d){window._statePaths[d.id]=this;});
    g.append('path')
      .datum(topojson.mesh(us,us.objects.states,(a,b)=>a!==b&&String(a.id)!==ALASKA&&a.id!==10&&a.id!==HAWAII&&String(b.id)!==ALASKA&&b.id!==10&&String(b.id)!=='15'))
      .attr('fill','none').attr('stroke','#002d50').attr('stroke-width','0.3').attr('d',pathGen);
    window._illuminateMap=()=>{ mapReady=true; if(pendingKids) renderMarkers(pendingKids,true); };
  }).catch(()=>{mapReady=true;if(pendingKids) renderMarkers(pendingKids,true);});

let centroids={};
function toSVG(lat,lon){const pt=projection([lon,lat]);return pt?{x:pt[0],y:pt[1]}:null;}
const BASE_PIN_R=isMobile?5.5:4.2,MIN_PIN_R=isMobile?4.5:3.0;
function getPinR(){return Math.max(MIN_PIN_R,BASE_PIN_R/currentK);}

function buildPinPositions(kids){
  const pts=[];
  kids.forEach(k=>{
    if(k.state==='AK'||k.state==='HI') return;
    const c=centroids[k.zip];let pos=null;
    if(c) pos=toSVG(c[0],c[1]);
    else if(k.lat!=null&&k.lon!=null) pos=toSVG(k.lat,k.lon);
    if(!pos) return;pts.push({kid:k,x:pos.x,y:pos.y});
  });
  const pr=getPinR(),minDist=pr*2.4;
  const svgPt=svgEl.createSVGPoint();
  const statePaths=Array.from(document.querySelectorAll('#states-group path.state'));
  function isOnLand(ax,ay){svgPt.x=ax;svgPt.y=ay;for(let sp of statePaths){if(sp.isPointInFill(svgPt)) return true;}return false;}
  for(let pass=0;pass<12;pass++){
    let moved=false;
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const dx=pts[j].x-pts[i].x,dy=pts[j].y-pts[i].y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<minDist&&dist>0){
          moved=true;
          const overlap=(minDist-dist)/2,nx=dx/dist,ny=dy/dist;
          const jx=pts[j].x+nx*overlap,jy=pts[j].y+ny*overlap;
          if(isOnLand(jx,jy)){pts[j].x=jx;pts[j].y=jy;}
          else{const ix=pts[i].x-nx*overlap,iy=pts[i].y-ny*overlap;
            if(isOnLand(ix,iy)){pts[i].x=ix;pts[i].y=iy;}
            else{const jx2=pts[j].x-ny*overlap,jy2=pts[j].y+nx*overlap;if(isOnLand(jx2,jy2)){pts[j].x=jx2;pts[j].y=jy2;}}
          }
        }
      }
    }
    if(!moved) break;
  }
  return pts;
}

function pinPath(r){
  const s=r/4.5;
  function tx(x){return(x-5.5)*s;}function ty(y){return(y-15)*s;}
  return `M${tx(5.5)},${ty(1)} C${tx(3.01)},${ty(1)} ${tx(1)},${ty(3.01)} ${tx(1)},${ty(5.5)} C${tx(1)},${ty(8.86)} ${tx(5.5)},${ty(15)} ${tx(5.5)},${ty(15)} C${tx(5.5)},${ty(15)} ${tx(10)},${ty(8.86)} ${tx(10)},${ty(5.5)} C${tx(10)},${ty(3.01)} ${tx(7.99)},${ty(1)} ${tx(5.5)},${ty(1)} Z`;
}

const card=document.getElementById('modal-card');
let isOpen=false,_selectedPin=null;
function highlightPin(gNode){clearHighlight();_selectedPin=gNode;d3.select(gNode).select('path').attr('fill','#f0a500');d3.select(gNode).select('circle').attr('fill','#c47800');}
function clearHighlight(){if(_selectedPin){d3.select(_selectedPin).select('path').attr('fill','#ffffff');d3.select(_selectedPin).select('circle').attr('fill','#004270');_selectedPin=null;}}
function hidePins(){
  d3.select('#pins-group').selectAll('g').each(function(){if(this!==_selectedPin){d3.select(this).style('pointer-events','none').transition().duration(200).style('opacity','0');}});
  d3.select('#zoom-controls').transition().duration(200).style('opacity','0').style('pointer-events','none');
  d3.select('#map-legend').transition().duration(200).style('opacity','0');
}
function showPins(){
  d3.select('#pins-group').selectAll('g').style('pointer-events','all').transition().duration(300).style('opacity','1');
  d3.select('#zoom-controls').transition().duration(300).style('opacity','1').style('pointer-events','all');
  d3.select('#map-legend').transition().duration(300).style('opacity','1');
}
function openModal(kid){
  if(isOpen) return;isOpen=true;_cancelInertia();
  document.getElementById('modal-name').textContent=kid.name;
  document.getElementById('modal-age').textContent=kid.age;
  document.getElementById('modal-location').textContent=kid.city&&kid.state?kid.city+', '+kid.state:kid.state||'';
  const kidLabel=kid.name+(kid.city?', '+kid.city:'')+(kid.state?', '+kid.state:'');
  document.getElementById('btn-build').onclick=function(e){e.preventDefault();window.parent.postMessage({type:'RSF_FILL_FORM',kiddo:kidLabel},'*');};
  document.getElementById('btn-sponsor').onclick=function(e){e.preventDefault();window.open(URL_SPONSOR,'_blank');};
  hidePins();
  setTimeout(()=>card.classList.add('active'),600);
}
function closeModal(){
  if(!isOpen) return;isOpen=false;
  card.classList.remove('active');
  setTimeout(()=>{clearHighlight();showPins();},500);
}
document.getElementById('map-wrap').addEventListener('click',()=>{if(isOpen) closeModal();});
card.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal();});

function renderMarkers(kids,animate){
  window._allKids=kids;
  const layer=d3.select('#pins-group');
  layer.selectAll('*').remove();
  const positions=buildPinPositions(kids);
  const pr=getPinR(),strokeW=Math.max(0.5,1.2/currentK),dotR=pr*0.38;
  positions.forEach((pt,ci)=>{
    const delay=animate?ci*8:0,kid=pt.kid;
    const g=layer.append('g').attr('transform',`translate(${pt.x},${pt.y})`).style('cursor','pointer').style('opacity',animate?'0':'1');
    g.append('path').attr('d',pinPath(pr)).attr('fill','#ffffff').attr('stroke','#004270').attr('stroke-width',strokeW).attr('stroke-linejoin','round').style('pointer-events','all');
    g.append('circle').attr('cx',0).attr('cy',-pr*2.11).attr('r',dotR).attr('fill','#004270').style('pointer-events','all');
    g.on('click',(e)=>{if(isOpen){closeModal();return;}e.stopPropagation();highlightPin(g.node());openModal(kid);})
     .on('mouseover',function(){d3.select(this).select('path').attr('transform','scale(1.18)');})
     .on('mouseout',function(){d3.select(this).select('path').attr('transform','');});
    if(!animate) return;
    const dropSVG=pr*4;
    g.attr('transform',`translate(${pt.x},${pt.y-dropSVG})`);
    setTimeout(()=>{g.style('opacity','1').transition().duration(340).ease(d3.easeBackOut.overshoot(1.4)).attr('transform',`translate(${pt.x},${pt.y})`);},delay);
  });
}

fetch('./zip_centroids.json')
  .then(r=>r.ok?r.json():{}).catch(()=>({}))
  .then(c=>{
    centroids=c;
    return fetch('./kids.json');
  })
  .then(r=>{if(!r.ok) throw new Error();return r.json();})
  .then(raw=>{
    const list=Array.isArray(raw)&&raw.length>0?deduplicateKids(raw):[];
    pendingKids=list;
    _resolveKidCount(list.length);
    const abbrToFips={'AL':'01','AZ':'04','AR':'05','CA':'06','CO':'08','CT':'09','DE':'10','FL':'12','GA':'13','ID':'16','IL':'17','IN':'18','IA':'19','KS':'20','KY':'21','LA':'22','ME':'23','MD':'24','MA':'25','MI':'26','MN':'27','MS':'28','MO':'29','MT':'30','NE':'31','NV':'32','NH':'33','NJ':'34','NM':'35','NY':'36','NC':'37','ND':'38','OH':'39','OK':'40','OR':'41','PA':'42','RI':'44','SC':'45','SD':'46','TN':'47','TX':'48','UT':'49','VT':'50','VA':'51','WA':'53','WV':'54','WI':'55','WY':'56','DC':'11'};
    const activeSet=new Set();
    list.forEach(k=>{const f=abbrToFips[k.state];if(f) activeSet.add(f);});
    window._kidsForIllumination=activeSet;
    if(mapReady) renderMarkers(list,true);
  })
  .catch(()=>{pendingKids=[];_resolveKidCount(0);window._kidsForIllumination=new Set();});

new ResizeObserver(()=>{if(window._allKids) renderMarkers(window._allKids,false);})
  .observe(document.getElementById('map-wrap'));
