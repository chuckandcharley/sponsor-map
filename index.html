<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Playhouse Map</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=source-sans-3:600,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#004270;--blue:#0378ad;--white:#fff;
  --ff:'Franklin Gothic Medium','Franklin Gothic','ITC Franklin Gothic','Source Sans 3','Arial Narrow',Arial,sans-serif;
}
html,body{width:100%;height:100%;margin:0;padding:0;background:#fff;overflow:hidden;font-family:var(--ff)}

#map-wrap{position:relative;width:100%;max-width:1200px;margin:0 auto;user-select:none;-webkit-user-select:none}
svg#us-map{width:100%;height:auto;display:block;cursor:grab;touch-action:none}
svg#us-map:active{cursor:grabbing}
.state{stroke:#002d50;stroke-width:0.5;stroke-linejoin:round}

/* Modal */
#modal-card{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(0.92);
  width:clamp(200px,26%,260px);
  display:flex;flex-direction:column;
  background:#fff;border-radius:16px;
  font-family:var(--ff);
  opacity:0;pointer-events:none;
  transition:opacity .25s ease, transform .25s cubic-bezier(0.34,1.56,0.64,1);
  overflow:hidden;z-index:50;
  box-shadow:0 8px 40px rgba(0,42,70,.22),0 2px 8px rgba(0,42,70,.10);
}
#modal-card.active{opacity:1;pointer-events:all;transform:translate(-50%,-50%) scale(1);}
@media(max-width:600px){
  #modal-card{
    position:fixed;
    left:50%;top:50%;
    width:82vw;
    max-width:320px;
  }
}
#modal-meta{
  font-size:11px;
  color:rgba(255,255,255,0.55);
  margin-top:5px;
  letter-spacing:.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#modal-top{background:var(--navy);padding:20px 20px 16px;}
#modal-waiting{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:6px;}
#modal-name{font-size:22px;font-weight:700;color:#fff;line-height:1.15;margin:0;}
#modal-meta{font-size:11px;color:rgba(255,255,255,0.55);margin-top:5px;letter-spacing:.02em;}

#modal-footer{padding:14px 20px 18px;display:flex;flex-direction:column;gap:8px;background:#fff;}

.btn{display:block;width:100%;padding:11px 10px;border-radius:8px;font-size:11px;font-weight:700;font-family:var(--ff);letter-spacing:.06em;text-transform:uppercase;text-align:center;text-decoration:none;cursor:pointer;border:2px solid transparent;transition:background .15s,transform .1s,box-shadow .15s;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 2px 8px rgba(0,42,70,.18);}
.btn-primary:hover{background:#003258;border-color:#003258;}
.btn-secondary{background:#fff;color:var(--navy);border-color:#cde4f0;}
.btn-secondary:hover{background:#f0f7fc;border-color:var(--blue);}

/* Zoom buttons */
#zoom-controls{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:30}
.zoom-btn{width:32px;height:32px;background:#fff;border:1.5px solid #cde4f0;border-radius:8px;font-size:18px;font-weight:700;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,42,70,.12);transition:background .12s,transform .1s;-webkit-tap-highlight-color:transparent;font-family:var(--ff)}
.zoom-btn:hover{background:#f0f7fc}
.zoom-btn:active{transform:scale(.93)}
#zoom-hint{position:absolute;bottom:16px;left:16px;font-size:10px;color:rgba(0,66,112,.45);letter-spacing:.08em;text-transform:uppercase;z-index:30;pointer-events:none}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;pointer-events:none}
#splash.fade-out{opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#num-clip{overflow:visible;line-height:1;width:100%;text-align:center;padding:0 20px}
#counter-num{display:block;font-size:clamp(72px,16vw,180px);font-weight:900;letter-spacing:-0.04em;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1;transform:translateY(110%);transition:transform 0s;text-align:center;will-change:transform;white-space:nowrap}
#counter-num.drop{transform:translateY(0);transition:transform 1s cubic-bezier(0.16,1,0.3,1)}
#label-clip{overflow:hidden;line-height:1;margin-top:.1em;width:100%;text-align:center;padding:0 20px}
#counter-label{display:block;font-size:clamp(13px,2.4vw,32px);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);line-height:1;transform:translateY(110%);transition:transform 0s;text-align:center;white-space:nowrap;will-change:transform}
#counter-label.rise{transform:translateY(0);transition:transform 0.85s cubic-bezier(0.16,1,0.3,1)}
#map-wrap{opacity:0;transition:opacity 1.2s ease}
#map-wrap.visible{opacity:1}
</style>
</head>
<body>

<div id="splash">
  <div id="num-clip"><span id="counter-num">0</span></div>
  <div id="label-clip"><span id="counter-label">waiting to be sponsored</span></div>
</div>

<div id="map-wrap">
  <svg id="us-map" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">

      <g id="pins-group"></g>
    </g>
  </svg>

  <div id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <div id="modal-top">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
        <div style="flex:1;min-width:0">
          <div id="modal-waiting">Waiting for a Sponsor</div>
          <div id="modal-name">&#8212;</div>
          <div id="modal-meta"><span id="modal-age"></span>&nbsp;&nbsp;·&nbsp;&nbsp;<span id="modal-location"></span></div>
        </div>
        <div style="flex-shrink:0;width:32px;margin-top:2px;opacity:0.9">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2048">
            <path fill="#ffffff" d="M 833.543 24.9457 L 835.261 24.812 C 844.162 24.0486 854.822 20.7168 863.96 19.4112 C 951.933 6.84074 1039.68 2.55187 1128.1 13.5491 C 1162.55 17.8343 1197 21.7025 1231.1 29.683 C 1459.71 77.0967 1664.85 202.203 1811.66 383.743 C 1852.34 433.985 1896.03 496.748 1923.67 555.192 C 1960.88 633.901 1956.95 738.11 1939.98 821.759 C 1895.04 1043.29 1720.99 1197.25 1521.74 1284.68 C 1528.61 1270.08 1534.47 1253.78 1540.7 1238.78 C 1559.98 1183.17 1571.63 1134.19 1574.44 1074.95 C 1580.64 944.298 1530.9 800.505 1444.33 702.774 C 1434.64 688.765 1410.11 666.083 1397 654.28 C 1324.71 589.168 1233.65 541.899 1137.39 524.833 C 984.994 497.814 847.714 529.55 721.588 618.114 C 680.009 647.342 643.189 682.81 612.425 723.266 C 608.797 728.06 600.394 738.919 597.399 743.82 C 562.312 795.152 538.038 843.969 519.909 903.37 C 511.076 930.979 506.861 967.91 503.539 996.629 C 501.167 1026.13 497.083 1075.8 502.939 1105.17 C 503.468 1121.72 507.148 1142.01 510.201 1158.41 C 531.251 1267.13 585.846 1366.51 666.31 1442.59 C 739.384 1511.02 815.608 1551.94 912.081 1576.58 C 931.058 1580.94 973.625 1589.6 991.996 1589.87 C 1012.24 1592.55 1033.77 1594.22 1054.21 1593.32 C 1065.72 1592.81 1078.08 1591.27 1089.6 1590.42 C 1095.37 1589.99 1105.49 1587 1110.44 1587.78 L 1110.5 1589 C 1097 1593.58 1081.4 1597.39 1067.57 1601.66 C 1039.09 1610.43 1009.88 1619.43 980.903 1626.33 C 898.952 1644.95 846.305 1649.82 761.327 1647.66 C 749.928 1647.4 738.552 1646.5 727.253 1644.97 C 722.583 1644.36 709.081 1642.16 705.061 1642.22 C 687.056 1638.27 667.947 1636.38 650.2 1632.06 C 478.414 1590.23 346.486 1454.81 277.077 1296.17 C 266.807 1272.7 251.853 1240.33 245.212 1215.46 C 223.59 1216.06 198.953 1215.44 177.128 1215.44 C 124.884 1215.3 72.64 1215.49 20.3988 1216.01 C 16.7222 1181.19 10.238 1148.04 7.4659 1111.92 C -6.96292 923.874 28.7594 724.979 117.979 557.466 C 144.088 506.885 170.061 467.504 202.001 421.256 C 208.192 413.912 213.93 405.999 219.913 398.42 C 339.09             <path fill="#ffffff" d="M 694.74 1327.94 C 641.237 1264.32 606.51 1187.06 594.451 1104.81 C 554.736 847.323 753.586 604.414 1016.21 598.583 C 1039.54 598.065 1073.08 599.231 1095.85 602.431 C 1194 616.218 1280.25 662.068 1349.24 732.662 C 1419.07 804.113 1457.69 887.05 1471.66 985.897 C 1477.07 1023.89 1476.23 1076.88 1468.26 1114.58 C 1459.99 1168.8 1434.18 1234.72 1403.99 1279.92 C 1394.53 1294.09 1383.66 1307.87 1373.95 1322.16 C 1375.57 1307.72 1374.9 1289.42 1374.87 1274.57 L 1374.77 1200.49 L 1374.73 1063.04 C 1374.58 1046.04 1374.97 1027.71 1374.22 1010.96 C 1386.32 1010.29 1412.48 1009.1 1423.83 1009.92 L 1038.83 690.576 C 1012.55 704.352 986.156 727.614 962.452 746.191 L 876.838 812.166 C 877.935 799.701 877.109 775.311 877.229 761.705 C 871.514 761.982 864.853 761.847 859.133 761.612 C 836.383 760.674 812.748 762.192 790.117 760.666 C 789.624 800.654 793.297 847.877 788.054 886.686 C 781.804 894.124 757.729 914.911 749.423 921.906 C 714.195 951.576 675.294 986.753 638.682 1014.13 C 656.809 1013.44 676.669 1013.84 694.925 1013.86 C 694.191 1025.15 694.799 1043.16 694.807 1054.82 L 694.673 1129.88 L 694.91 1268.67 C 694.959 1288.24 694.316 1308.59 694.74 1327.94 z"/>
          </svg>
        </div>
      </div>
    </div>

    <div id="modal-footer">
      <a id="btn-build" href="#" class="btn btn-primary">I Want to Build This</a>
      <a id="btn-sponsor" href="#" class="btn btn-secondary">Fund This Build</a>

    </div>
  </div>

  <div id="zoom-controls">
    <button class="zoom-btn" id="btn-zoom-in" aria-label="Zoom in">+</button>
    <button class="zoom-btn" id="btn-zoom-out" aria-label="Zoom out">−</button>
    <button class="zoom-btn" id="btn-zoom-reset" aria-label="Reset zoom" style="font-size:11px">⊙</button>
  </div>
  
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const SVG_W=960, SVG_H=600;
const ALASKA='02', HAWAII=15;
const PALETTE=['#004270','#00527f','#01618e','#01719e','#0378ad','#0266a5'];
const URL_BUILD   = 'VIRTUOUS_FORM_URL_HERE';
const URL_SPONSOR = 'https://give.rocsolidfoundation.org/campaign/799349/donate';

// Kid count promise for countdown sync
let _resolveKidCount;
const _kidCountReady = new Promise(r=>{ _resolveKidCount=r; });

// Projection
const projection = d3.geoAlbersUsa().scale(1280).translate([SVG_W/2, SVG_H/2]);
const pathGen = d3.geoPath().projection(projection);

// ── D3 ZOOM ─────────────────────────────────────────────────
let currentK = 1; // current zoom scale
const svg = d3.select('#us-map');
const zoomGroup = d3.select('#zoom-group');

let lastReclusterK = 1;
const zoom = d3.zoom()
  .scaleExtent([1, 12])
  .translateExtent([[0,0],[SVG_W,SVG_H]])
  .on('zoom', event=>{
    currentK = event.transform.k;
    zoomGroup.attr('transform', event.transform);
    // Only recluster when zoom changes by more than 15% — prevents flickering
    clearTimeout(window._reclusterTimer);
    window._reclusterTimer = setTimeout(()=>{
      if(window._allKids && Math.abs(currentK - lastReclusterK)/lastReclusterK > 0.15){
        lastReclusterK = currentK;
        renderMarkers(window._allKids, false);
      }
    }, 80);
  });

svg.call(zoom);

// Zoom buttons
document.getElementById('btn-zoom-in').addEventListener('click', ()=>{
  svg.transition().duration(320).call(zoom.scaleBy, 2);
});
document.getElementById('btn-zoom-out').addEventListener('click', ()=>{
  svg.transition().duration(320).call(zoom.scaleBy, 0.5);
});
document.getElementById('btn-zoom-reset').addEventListener('click', ()=>{
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
});

// ── STATE MAP ────────────────────────────────────────────────
let mapReady=false, pendingKids=null;
window._statePaths={};

fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
  .then(r=>r.json()).then(us=>{
    const stateFeatures = topojson.feature(us, us.objects.states).features
      .filter(d=> String(d.id)!==ALASKA && d.id!==10 && String(d.id)!=='15');

    const g = d3.select('#states-group');
    g.selectAll('path.state')
      .data(stateFeatures).enter().append('path')
      .attr('class','state')
      .attr('d', pathGen)
      .attr('fill',(d,i)=>PALETTE[i%PALETTE.length])
      .each(function(d){
        window._statePaths[d.id]=this;
        this.style.opacity='0';
        this.style.transition='none';
      });

    const border = g.append('path')
      .datum(topojson.mesh(us, us.objects.states,
        (a,b)=>a!==b && String(a.id)!==ALASKA && a.id!==10 && a.id!==HAWAII
                     && String(b.id)!==ALASKA && b.id!==10 && String(b.id)!=='15'))
      .attr('fill','none').attr('stroke','#002d50')
      .attr('stroke-width','0.3').attr('d',pathGen)
      .style('opacity','0');

    const STATE_MS = 2600;
    window._illuminateMap = activeSet=>{
      stateFeatures.forEach((d,i)=>{
        const el=window._statePaths[d.id]; if(!el) return;
        setTimeout(()=>{ el.style.transition='opacity 0.7s ease'; el.style.opacity='1'; }, 40+i*46);
      });
      setTimeout(()=>{ border.transition().duration(600).style('opacity','1'); }, STATE_MS-400);
      setTimeout(()=>{ mapReady=true; if(pendingKids) renderMarkers(pendingKids,true); }, STATE_MS);
    };
    // countdown triggers illumination after splash
  }).catch(()=>{ mapReady=true; if(pendingKids) renderMarkers(pendingKids,true); });

// ── CENTROIDS ────────────────────────────────────────────────
let centroids={};

// ── SVG COORD LOOKUP ─────────────────────────────────────────
// Returns {x,y} in SVG viewBox units (0-960, 0-600)
function toSVG(lat, lon){
  const pt = projection([lon, lat]);
  return pt ? {x:pt[0], y:pt[1]} : null;
}

// ── CLUSTER in SCREEN PIXELS then express in SVG units ───────
// This guarantees clusters dissolve correctly at any zoom level
// because we measure overlap in the same px the user sees
function buildClusters(kids){
  // Resolve every kid to SVG coords first
  const pts = [];
  kids.forEach(k=>{
    if(k.state==='AK'||k.state==='HI') return;
    const c = centroids[k.zip];
    let pos = null;
    if(c) pos = toSVG(c[0], c[1]);
    else if(k.lat!=null&&k.lon!=null) pos = toSVG(k.lat, k.lon);
    if(!pos) return;
    pts.push({kid:k, x:pos.x, y:pos.y});
  });

  // At zoom >= 4, show every pin individually — spread same-coord pins
  if(currentK >= 4){
    // Group by exact coordinate
    const coordMap = {};
    pts.forEach(p=>{
      const key = `${Math.round(p.x*100)},${Math.round(p.y*100)}`;
      if(!coordMap[key]) coordMap[key]=[];
      coordMap[key].push(p);
    });
    const result = [];
    Object.values(coordMap).forEach(group=>{
      if(group.length===1){
        result.push({kids:[group[0].kid], x:group[0].x, y:group[0].y});
      } else {
        // Spread in a small circle so each pin is individually tappable
        // Spread radius shrinks as zoom increases so pins stay close to real location
        // Spread pins just enough to be individually tappable
        // Pin diameter in SVG units at current zoom = BASE_PIN_R*2 / currentK
        // We space by 1.5x pin diameter so there's clear separation
        const pinDiam = (BASE_PIN_R * 2) / currentK;
        const spread = pinDiam * 1.5;
        const RING1_MAX = 6;
        group.forEach((p,i)=>{
          let radius, angleOffset;
          if(group.length <= RING1_MAX){
            radius = spread;
            angleOffset = (i / group.length) * 2 * Math.PI;
          } else {
            if(i < RING1_MAX){
              radius = spread;
              angleOffset = (i / RING1_MAX) * 2 * Math.PI;
            } else {
              const outerIdx = i - RING1_MAX;
              const outerCount = group.length - RING1_MAX;
              radius = spread * 2;
              angleOffset = (outerIdx / outerCount) * 2 * Math.PI;
            }
          }
          // Simple: try spread position, if water nudge toward map center
          const svgEl = document.getElementById('us-map');
          const pt = svgEl.createSVGPoint();
          const isOnLand = (ax, ay) => {
            pt.x = ax; pt.y = ay;
            const statePaths = document.querySelectorAll('#states-group path.state');
            for(let sp of statePaths){ if(sp.isPointInFill(pt)) return true; }
            return false;
          };
          let tx = p.x + Math.cos(angleOffset) * radius;
          let ty = p.y + Math.sin(angleOffset) * radius;
          if(!isOnLand(tx, ty)){
            // Nudge toward map center instead
            const a = Math.atan2(SVG_H/2 - p.y, SVG_W/2 - p.x);
            tx = p.x + Math.cos(a) * radius;
            ty = p.y + Math.sin(a) * radius;
          }
          result.push({kids:[p.kid], x:tx, y:ty});
        });
      }
    });
    return result;
  }

  // Cluster threshold in SVG units based on zoom level
  // At zoom 1: ~18 SVG units threshold (covers ~18px at default render)
  // Shrinks proportionally as zoom increases
  const thresh = 18 / currentK;

  // Greedy cluster
  const used = new Uint8Array(pts.length);
  const clusters = [];
  pts.forEach((p,i)=>{
    if(used[i]) return;
    const grp=[p]; used[i]=1;
    pts.forEach((p2,j)=>{
      if(used[j]) return;
      const dx=p2.x-p.x, dy=p2.y-p.y;
      if(Math.sqrt(dx*dx+dy*dy) < thresh){ grp.push(p2); used[j]=1; }
    });
    const cx=grp.reduce((s,g)=>s+g.x,0)/grp.length;
    const cy=grp.reduce((s,g)=>s+g.y,0)/grp.length;
    clusters.push({kids:grp.map(g=>g.kid), x:cx, y:cy});
  });
  return clusters;
}

// ── RENDER ───────────────────────────────────────────────────
// PIN_R: radius of the pin head in SVG units at zoom=1
// We divide by currentK so pins stay a consistent visual size
const BASE_PIN_R = 3.8;
const BASE_CLUSTER_R = 11;

function pinPath(r){
  // Exact original pin scaled to radius r
  // Original viewBox 0 0 11 16, tip at bottom (5.5,15), head center at (5.5,5.5)
  // We scale so head radius = r, tip at (0,0)
  // Original head radius = 4.5, scale factor = r/4.5
  // Translate: subtract (5.5, 15) so tip is at origin, then scale
  const s = r / 4.5;
  function tx(x){ return (x - 5.5) * s; }
  function ty(y){ return (y - 15) * s; }
  return `M${tx(5.5)},${ty(1)} C${tx(3.01)},${ty(1)} ${tx(1)},${ty(3.01)} ${tx(1)},${ty(5.5)} C${tx(1)},${ty(8.86)} ${tx(5.5)},${ty(15)} ${tx(5.5)},${ty(15)} C${tx(5.5)},${ty(15)} ${tx(10)},${ty(8.86)} ${tx(10)},${ty(5.5)} C${tx(10)},${ty(3.01)} ${tx(7.99)},${ty(1)} ${tx(5.5)},${ty(1)} Z`;
}

function renderMarkers(kids, animate){
  window._allKids = kids;
  const layer = d3.select('#pins-group');
  layer.selectAll('*').remove();

  const clusters = buildClusters(kids);
  const pr = BASE_PIN_R / currentK;  // pin head radius in SVG units
  const cr = BASE_CLUSTER_R / currentK; // cluster radius in SVG units
  const strokeW = 0.9 / currentK;
  const dotR = pr * 0.38;
  const fontSize = Math.max(3.5, 8 / currentK);

  // Render single pins first, then clusters on top
  const singles = clusters.filter(cl=>cl.kids.length===1);
  const groups  = clusters.filter(cl=>cl.kids.length>1);
  const ordered = [...singles, ...groups];

  ordered.forEach((cl, ci)=>{
    const delay = animate ? ci * 8 : 0;

    if(cl.kids.length===1){
      const kid = cl.kids[0];
      const g = layer.append('g')
        .attr('transform',`translate(${cl.x},${cl.y})`)
        .style('cursor','pointer')
        .style('opacity','0');

      // Teardrop pin — tip at (0,0), body above
      g.append('path')
        .attr('d', pinPath(pr))
        .attr('fill','#ffffff')
        .attr('stroke','#004270')
        .attr('stroke-width', strokeW)
        .attr('stroke-linejoin','round');

      // Center dot
      g.append('circle')
        .attr('cx',0).attr('cy',-pr*2.11)
        .attr('r', dotR)
        .attr('fill','#004270');

      // Invisible hit area — generously sized
      g.append('circle')
        .attr('cx',0).attr('cy',-pr*2.11)
        .attr('r', pr*2.2)
        .attr('fill','transparent')
        .attr('stroke','none');

      g.on('click',(e)=>{ e.stopPropagation(); openModal(kid); })
       .on('mouseover', function(){ d3.select(this).select('path').attr('transform',`scale(1.3) translate(0,${pr*0.15})`); })
       .on('mouseout',  function(){ d3.select(this).select('path').attr('transform',''); });

      setTimeout(()=>{
        g.style('opacity','1');
        if(animate){
          // Ripple in SVG
          const ripple = layer.insert('circle','g')
            .attr('cx',cl.x).attr('cy',cl.y)
            .attr('r', pr*0.5)
            .attr('fill','none')
            .attr('stroke','#d0e8f5')
            .attr('stroke-width', strokeW*1.5)
            .style('opacity','0.85');
          ripple.transition().duration(750).ease(d3.easeCubicOut)
            .attr('r', pr*5)
            .style('opacity','0')
            .remove();
        }
      }, delay);

    } else {
      // Cluster badge
      const g = layer.append('g')
        .attr('transform',`translate(${cl.x},${cl.y})`)
        .style('cursor','pointer')
        .style('opacity','0');

      g.append('circle')
        .attr('r', cr)
        .attr('fill','#0378ad')
        .attr('stroke','#ffffff')
        .attr('stroke-width', strokeW*1.5);

      g.append('text')
        .attr('text-anchor','middle')
        .attr('dominant-baseline','central')
        .attr('fill','#ffffff')
        .attr('font-family','Franklin Gothic Medium,Franklin Gothic,ITC Franklin Gothic,Source Sans 3,Arial Narrow,Arial,sans-serif')
        .attr('font-weight','700')
        .attr('font-size', fontSize)
        .text(cl.kids.length);

      // Hit area
      g.append('circle')
        .attr('r', cr*1.3)
        .attr('fill','transparent').attr('stroke','none');

      g.on('click',(e)=>{
        e.stopPropagation();
        // Zoom to double current scale, centered on this cluster
        const newK = Math.min(currentK*2.5, 12);
        // Get current transform
        const t = d3.zoomTransform(svg.node());
        // Center the cluster in the viewport
        const svgEl = document.getElementById('us-map');
        const rect = svgEl.getBoundingClientRect();
        const newTx = rect.width/2 - cl.x * newK;
        const newTy = (rect.width*(SVG_H/SVG_W))/2 - cl.y * newK;
        svg.transition().duration(450).call(
          zoom.transform,
          d3.zoomIdentity.translate(newTx, newTy).scale(newK)
        );
      })
      .on('mouseover', function(){ d3.select(this).select('circle').attr('r', cr*1.12); })
      .on('mouseout',  function(){ d3.select(this).select('circle').attr('r', cr); });

      setTimeout(()=>{ g.style('opacity','1'); }, delay);
    }
  });
}

// ── MODAL ────────────────────────────────────────────────────
const card = document.getElementById('modal-card');
let isOpen=false;

function fadePinsOut(cb){
  d3.select('#pins-group').transition().duration(180).style('opacity','0');
  setTimeout(cb,200);
}
function fadePinsIn(){
  d3.select('#pins-group').transition().duration(200).style('opacity','1');
}

function openModal(kid){
  if(isOpen) return; isOpen=true;
  document.getElementById('modal-name').textContent = kid.name;
  document.getElementById('modal-age').textContent = kid.age;
  document.getElementById('modal-location').textContent =
    kid.city&&kid.state ? kid.city+', '+kid.state : kid.state||'';
  const enc = encodeURIComponent(kid.name);
  // Build button — will use postMessage to fill Virtuous form on parent page
  const kidLabel = kid.name + (kid.city ? ', ' + kid.city : '') + (kid.state ? ', ' + kid.state : '');
  document.getElementById('btn-build').onclick = function(e){
    e.preventDefault();
    window.parent.postMessage({
      type: 'RSF_FILL_FORM',
      kiddo: kidLabel
    }, '*');
  };
  // GoFundMe blocks iframes — break out to parent tab
  document.getElementById('btn-sponsor').onclick = function(e){
    e.preventDefault();
    window.parent.location.href = URL_SPONSOR;
  };
  fadePinsOut(()=>card.classList.add('active'));
}
function closeModal(){
  if(!isOpen) return; isOpen=false;
  card.classList.remove('active');
  setTimeout(fadePinsIn,230);
}
document.getElementById('map-wrap').addEventListener('click',()=>{ if(isOpen) closeModal(); });
card.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

// ── DATA FETCH ───────────────────────────────────────────────
fetch('./zip_centroids.json')
  .then(r=>r.ok?r.json():{}).catch(()=>({}))
  .then(c=>{
    centroids=c;
    return fetch('./kids.json');
  })
  .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
  .then(kids=>{
    const list = Array.isArray(kids)&&kids.length>0 ? kids : [];
    pendingKids=list;
    _resolveKidCount(list.length);
    const abbrToFips={
      'AL':'01','AZ':'04','AR':'05','CA':'06','CO':'08','CT':'09','DE':'10',
      'FL':'12','GA':'13','ID':'16','IL':'17','IN':'18','IA':'19','KS':'20',
      'KY':'21','LA':'22','ME':'23','MD':'24','MA':'25','MI':'26','MN':'27',
      'MS':'28','MO':'29','MT':'30','NE':'31','NV':'32','NH':'33','NJ':'34',
      'NM':'35','NY':'36','NC':'37','ND':'38','OH':'39','OK':'40','OR':'41',
      'PA':'42','RI':'44','SC':'45','SD':'46','TN':'47','TX':'48','UT':'49',
      'VT':'50','VA':'51','WA':'53','WV':'54','WI':'55','WY':'56','DC':'11'
    };
    const activeSet=new Set();
    list.forEach(k=>{ const f=abbrToFips[k.state]; if(f) activeSet.add(f); });
    window._kidsForIllumination=activeSet;
    // Countdown will trigger illumination after splash fades
  })
  .catch(()=>{
    pendingKids=[];
    _resolveKidCount(0);
    window._kidsForIllumination=new Set();
  });

// ── RESIZE ───────────────────────────────────────────────────
new ResizeObserver(()=>{
  if(window._allKids) renderMarkers(window._allKids,false);
}).observe(document.getElementById('map-wrap'));

// ── COUNTDOWN ────────────────────────────────────────────────
(async function(){
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const numEl=document.getElementById('counter-num');
  const labelEl=document.getElementById('counter-label');
  const splash=document.getElementById('splash');
  const mapWrap=document.getElementById('map-wrap');

  function countUp(target,duration){
    return new Promise(res=>{
      const start=performance.now();
      (function tick(now){
        const p=Math.min((now-start)/duration,1);
        const eased=1-Math.pow(1-p,4);
        numEl.textContent=Math.round(eased*target);
        if(p<1) requestAnimationFrame(tick); else res();
      })(performance.now());
    });
  }

  await sleep(300);
  numEl.classList.add('drop');
  await sleep(400);
  const target=await _kidCountReady;
  await countUp(target,2200);
  await sleep(60);
  labelEl.classList.add('rise');
  await sleep(1400);
  splash.classList.add('fade-out');
  mapWrap.classList.add('visible');
  await sleep(400);
  // Map builds NOW — user sees the full animation as splash fades
  if(window._illuminateMap && window._kidsForIllumination){
    window._illuminateMap(window._kidsForIllumination);
  }
  await sleep(1000);
  splash.style.display='none';
})();
</script>
